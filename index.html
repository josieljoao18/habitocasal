<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // ===== UTILITÁRIOS =====
        const getToday = () => new Date().toISOString().split('T')[0];
        const formatDate = (date) => new Date(date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const formatDayName = (date) => date.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
        
        const showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.style.background = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        };
        
        const showConfetti = () => {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = `hsl(${Math.random() * 360}, 70%, 50%)`;
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        };
        
        const getWeekDays = () => {
            const today = new Date();
            const days = [];
            for (let i = 3; i >= 0; i--) { const d = new Date(); d.setDate(today.getDate() - i); days.push(d); }
            for (let i = 1; i <= 3; i++) { const d = new Date(); d.setDate(today.getDate() + i); days.push(d); }
            return days.sort((a,b) => a - b);
        };
        
        const getDateRange = (period) => {
            const today = new Date();
            const dates = [];
            const days = period === 'week' ? 7 : 30;
            for (let i = days - 1; i >= 0; i--) {
                const date = new Date();
                date.setDate(today.getDate() - i);
                dates.push(date.toISOString().split('T')[0]);
            }
            return dates;
        };
        
        const calculateStreak = (dates) => {
            if (!dates || dates.length === 0) return 0;
            const sorted = [...dates].sort().reverse();
            let streak = 1;
            let current = new Date(sorted[0]);
            for (let i = 1; i < sorted.length; i++) {
                const prev = new Date(sorted[i]);
                const diff = Math.floor((current - prev) / (1000 * 60 * 60 * 24));
                if (diff === 1) { streak++; current = prev; }
                else break;
            }
            return streak;
        };
        
        const calculateLevel = (total) => {
            const level = Math.floor(total / 30) + 1;
            const nextLevel = (level * 30) - total;
            const progress = (total % 30) * 3.33;
            return { level, nextLevel, progress };
        };
        
        // ===== HÁBITOS DO CASAL =====
        const coupleHabits = [
            { title: 'Elogiar o parceiro', description: 'Diga algo positivo', icon: '❤️', tag: 'amor', category: 'amor', frequency: { type: 'daily' }, points: 10 },
            { title: 'Conversar sem celular', description: 'Momento sem distrações', icon: '💬', tag: 'comunicação', category: 'comunicação', frequency: { type: 'daily' }, points: 15 },
            { title: 'Gratidão diária', description: 'Agradecer a Deus', icon: '🙏', tag: 'espiritual', category: 'espiritual', frequency: { type: 'daily' }, points: 10 },
            { title: 'Mensagem carinhosa', description: 'Enviar mensagem', icon: '💌', tag: 'amor', category: 'amor', frequency: { type: 'daily' }, points: 10 },
            { title: 'Tempo de qualidade', description: 'Dedicar tempo ao casal', icon: '💑', tag: 'relacionamento', category: 'relacionamento', frequency: { type: 'daily' }, points: 20 },
            { title: 'Oração juntos', description: 'Orar em casal', icon: '✝️', tag: 'espiritual', category: 'espiritual', frequency: { type: 'daily' }, points: 15 },
            { title: 'Ler a Bíblia', description: 'Devocional diário', icon: '📖', tag: 'espiritual', category: 'espiritual', frequency: { type: 'daily' }, points: 15 },
            { title: 'Exercício físico', description: 'Praticar atividade', icon: '🏃', tag: 'saúde', category: 'saúde', frequency: { type: 'daily' }, points: 10 },
            { title: 'Dormir bem', description: '7-8 horas de sono', icon: '😴', tag: 'saúde', category: 'saúde', frequency: { type: 'daily' }, points: 10 }
        ];
        
        const allEmojis = ['❤️', '💬', '🙏', '💌', '💑', '✝️', '📖', '🏃', '😴', '💪', '🧘', '🥗', '⭐', '✨', '🌟', '🎯', '🎉', '💖', '🤝', '🕊️', '⛪', '🌹'];
        const categories = ['amor', 'comunicação', 'espiritual', 'saúde', 'relacionamento'];
        
        // ===== COMPONENTES =====
        const WeekCalendar = ({ selectedDate, onDateSelect, habits }) => {
            const weekDays = getWeekDays();
            const today = new Date();
            const isDateCompleted = (date) => {
                const dateStr = date.toISOString().split('T')[0];
                return habits.some(h => h.completedDates?.includes(dateStr));
            };
            return (
                <div className="bg-card border border-primary rounded-2xl p-3">
                    <div className="week-calendar">
                        {weekDays.map((day, idx) => {
                            const isSelected = selectedDate && day.toDateString() === new Date(selectedDate).toDateString();
                            const isToday = day.toDateString() === today.toDateString();
                            return (
                                <div key={idx} onClick={() => onDateSelect(day)} className={`week-day ${isSelected ? 'week-day-selected' : ''} ${isDateCompleted(day) ? 'week-day-completed' : ''}`}>
                                    <div className="text-xs font-medium">{formatDayName(day)}</div>
                                    <div className={`text-lg font-bold ${isToday && !isSelected ? 'text-green-400' : 'text-primary'}`}>{day.getDate()}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        // ===== GRÁFICO DE RADAR =====
        const RadarChart = ({ habits, period }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);
            
            React.useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const dateRange = getDateRange(period);
                    const categoryLabels = ['Amor', 'Comunicação', 'Espiritual', 'Saúde', 'Relacionamento'];
                    const categoryData = categoryLabels.map(cat => {
                        const catKey = cat === 'Amor' ? 'amor' : cat === 'Comunicação' ? 'comunicação' : cat === 'Espiritual' ? 'espiritual' : cat === 'Saúde' ? 'saúde' : 'relacionamento';
                        const catHabits = habits.filter(h => h.tag === catKey);
                        let total = 0;
                        catHabits.forEach(h => {
                            total += h.completedDates?.filter(d => dateRange.includes(d)).length || 0;
                        });
                        const maxPossible = catHabits.length * dateRange.length;
                        return maxPossible > 0 ? (total / maxPossible) * 100 : 0;
                    });
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'radar',
                        data: { labels: categoryLabels, datasets: [{ label: 'Taxa de Conclusão (%)', data: categoryData, backgroundColor: 'rgba(16, 185, 129, 0.2)', borderColor: '#10b981', borderWidth: 2, pointBackgroundColor: '#10b981', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } }, tooltip: { callbacks: { label: (ctx) => `${ctx.raw.toFixed(1)}%` } } }, scales: { r: { beginAtZero: true, max: 100, ticks: { color: '#9ca3af', stepSize: 20, backdropColor: 'transparent' }, grid: { color: '#2d2d44' }, pointLabels: { color: '#e8e8f0', font: { size: 11 } } } } }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [habits, period]);
            
            return (
                <div className="bg-card border border-primary rounded-2xl p-4">
                    <h3 className="text-sm font-semibold text-primary mb-3">📡 Desempenho por Categoria</h3>
                    <div style={{ height: '260px' }}><canvas ref={chartRef}></canvas></div>
                </div>
            );
        };
        
        // ===== GRÁFICO DE PROGRESSO MENSAL =====
        const MonthlyChart = ({ habits }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);
            
            React.useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                    const currentMonth = new Date().getMonth();
                    const last6Months = [];
                    for (let i = 5; i >= 0; i--) last6Months.push(months[(currentMonth - i + 12) % 12]);
                    const monthlyData = last6Months.map((_, idx) => {
                        const monthNum = (currentMonth - (5 - idx) + 12) % 12;
                        let total = 0;
                        habits.forEach(h => {
                            total += h.completedDates?.filter(d => new Date(d).getMonth() === monthNum).length || 0;
                        });
                        return habits.length > 0 ? total / habits.length : 0;
                    });
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'line',
                        data: { labels: last6Months, datasets: [{ label: 'Média de Hábitos Concluídos', data: monthlyData, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', borderWidth: 3, fill: true, tension: 0.4, pointBackgroundColor: '#10b981', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#9ca3af' } } }, scales: { y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: '#2d2d44' } }, x: { ticks: { color: '#9ca3af' }, grid: { color: '#2d2d44' } } } }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [habits]);
            
            return (
                <div className="bg-card border border-primary rounded-2xl p-4">
                    <h3 className="text-sm font-semibold text-primary mb-3">📈 Evolução dos Hábitos</h3>
                    <div style={{ height: '220px' }}><canvas ref={chartRef}></canvas></div>
                </div>
            );
        };
        
        // ===== COMPONENTE HABIT CARD =====
        const HabitCard = ({ habit, onToggle, onEdit, onDelete, selectedDate, index }) => {
            const dateToCheck = selectedDate ? selectedDate.toISOString().split('T')[0] : getToday();
            const completed = habit.completedDates?.includes(dateToCheck) || false;
            const [showMenu, setShowMenu] = React.useState(false);
            const [menuPos, setMenuPos] = React.useState({ x: 0, y: 0 });
            const [isHovered, setIsHovered] = React.useState(false);
            
            const getFreqText = () => {
                if (!habit.frequency) return '📅 Todo dia';
                if (habit.frequency.type === 'daily') return '📅 Todo dia';
                if (habit.frequency.type === 'weekly') return `📆 ${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][habit.frequency.day]}`;
                return `🔄 A cada ${habit.frequency.interval} dias`;
            };
            
            const getTagColor = () => {
                const colors = { amor: 'bg-pink-500/20 text-pink-400', comunicação: 'bg-blue-500/20 text-blue-400', espiritual: 'bg-purple-500/20 text-purple-400', saúde: 'bg-green-500/20 text-green-400', relacionamento: 'bg-orange-500/20 text-orange-400' };
                return colors[habit.tag] || 'bg-gray-500/20 text-gray-400';
            };
            
            return (
                <div className={`bg-card border border-primary rounded-2xl p-3 transition-all duration-300 ${isHovered ? 'border-green-500/50 shadow-lg shadow-green-500/10' : ''}`} onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)} style={{ animationDelay: `${index * 0.05}s` }} className="animate-fade-in-up">
                    <div className="flex items-start gap-3">
                        <div className="flex-1">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">{habit.icon}</span>
                                <div>
                                    <h3 className="text-primary font-semibold text-sm">{habit.title}</h3>
                                    <div className="flex items-center gap-2 mt-0.5">
                                        <p className="text-secondary text-xs">{getFreqText()}</p>
                                        <span className={`text-xs px-2 py-0.5 rounded-full ${getTagColor()}`}>{habit.tag}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 mt-2">
                                <div className="flex items-center gap-1">
                                    <span className="text-xs text-orange-400">🔥</span>
                                    <span className="text-xs text-orange-400 font-semibold">{habit.streak || 0}</span>
                                </div>
                                <div className="flex items-center gap-1">
                                    <span className="text-xs text-green-400">✅</span>
                                    <span className="text-secondary text-xs">{habit.completedDates?.length || 0}</span>
                                </div>
                            </div>
                            {habit.description && <p className="text-secondary text-xs mt-2">{habit.description}</p>}
                        </div>
                        <div className="flex flex-col items-center gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setMenuPos({ x: e.clientX, y: e.clientY }); setShowMenu(true); }} className="text-secondary hover:text-primary p-1 rounded-lg text-xl transition-all hover:scale-110">⋮</button>
                            <button onClick={() => onToggle(habit.id, dateToCheck)} className={`check-button ${completed ? 'check-button-completed' : 'check-button-pending'}`} style={{ width: '42px', height: '42px', fontSize: '20px' }}>
                                {completed ? '✓' : '○'}
                            </button>
                        </div>
                    </div>
                    {showMenu && (
                        <div className="context-menu" style={{ top: menuPos.y - 60, left: menuPos.x - 130 }}>
                            <div className="context-menu-item" onClick={() => { onEdit(habit); setShowMenu(false); }}>✏️ Editar Hábito</div>
                            <div className="context-menu-item delete" onClick={() => { if (confirm(`Deletar "${habit.title}"?`)) onDelete(habit.id); setShowMenu(false); }}>🗑️ Deletar Hábito</div>
                        </div>
                    )}
                </div>
            );
        };
        
        // ===== TELA DE LOGIN =====
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [isRegister, setIsRegister] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    if (isRegister) await window.firebaseCreateUser(window.firebaseAuth, email, password);
                    else await window.firebaseSignIn(window.firebaseAuth, email, password);
                    showToast(isRegister ? 'Conta criada com sucesso! 🎉' : 'Bem-vindo de volta! 👋');
                    onLogin();
                } catch (err) { 
                    let msg = err.message;
                    if (msg.includes('auth/invalid-email')) msg = 'Email inválido';
                    else if (msg.includes('auth/user-not-found')) msg = 'Usuário não encontrado';
                    else if (msg.includes('auth/wrong-password')) msg = 'Senha incorreta';
                    else if (msg.includes('auth/email-already-in-use')) msg = 'Email já cadastrado';
                    setError(msg);
                    showToast(msg, 'error');
                }
                setLoading(false);
            };
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-[#0a0a0f] to-[#0f0f1a] flex items-center justify-center p-4">
                    <div className="glass-effect rounded-3xl p-8 max-w-md w-full border border-primary animate-fade-in-up">
                        <div className="text-center mb-6">
                            <div className="text-7xl mb-3 animate-pulse">💑</div>
                            <h1 className="text-3xl font-bold couple-name-highlight">HabitFlow</h1>
                            <p className="text-secondary text-sm mt-2">Fortaleça seu relacionamento com Deus</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="email" placeholder="seu@email.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:ring-2 focus:ring-green-500 transition-all" required />
                            <input type="password" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:ring-2 focus:ring-green-500 transition-all" required />
                            {error && <p className="text-red-400 text-sm text-center animate-shake">{error}</p>}
                            <button type="submit" disabled={loading} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl font-semibold transition-all hover:shadow-lg hover:shadow-green-500/30 transform hover:scale-[1.02] disabled:opacity-50">
                                {loading ? <div className="loading-spinner mx-auto"></div> : (isRegister ? 'Criar Conta ✨' : 'Entrar 🚀')}
                            </button>
                            <p className="text-center text-secondary text-sm">
                                {isRegister ? 'Já tem conta?' : 'Não tem conta?'}{' '}
                                <button type="button" onClick={() => setIsRegister(!isRegister)} className="text-green-400 hover:underline">{isRegister ? 'Fazer login' : 'Cadastre-se'}</button>
                            </p>
                        </form>
                    </div>
                </div>
            );
        };
        
        // ===== VISÃO DE ESTATÍSTICAS =====
        const StatisticsView = ({ habits, personName }) => {
            const [period, setPeriod] = React.useState('week');
            const totalCompletions = habits.reduce((acc, h) => acc + (h.completedDates?.length || 0), 0);
            const totalStreak = habits.reduce((acc, h) => acc + (h.streak || 0), 0);
            const bestHabit = habits.reduce((best, h) => (h.streak > (best?.streak || 0) ? h : best), null);
            const level = calculateLevel(totalCompletions);
            const dateRange = getDateRange(period);
            let periodCompletions = 0;
            habits.forEach(h => { periodCompletions += h.completedDates?.filter(d => dateRange.includes(d)).length || 0; });
            const avgPerDay = dateRange.length > 0 ? (periodCompletions / dateRange.length).toFixed(1) : 0;
            const completionRate = habits.length > 0 ? (totalCompletions / (habits.length * 30) * 100).toFixed(1) : 0;
            
            const categoryStats = {};
            habits.forEach(h => { categoryStats[h.tag] = (categoryStats[h.tag] || 0) + (h.completedDates?.length || 0); });
            
            return (

                        <div className="bg-card border border-primary rounded-2xl p-4 stat-card text-center"><div className="text-3xl mb-1">🔥</div><p className="text-2xl font-bold text-primary">{totalStreak}</p><p className="text-secondary text-xs">streak total</p></div>
                        <div className="bg-card border border-primary rounded-2xl p-4 stat-card text-center"><div className="text-3xl mb-1">📈</div><p className="text-2xl font-bold text-primary">{completionRate}%</p><p className="text-secondary text-xs">taxa de conclusão</p></div>
                        <div className="bg-card border border-primary rounded-2xl p-4 stat-card text-center"><div className="text-3xl mb-1">🏆</div><p className="text-2xl font-bold text-primary">{level.level}</p><p className="text-secondary text-xs">nível</p></div>
                    </div>
                    
                    {/* Barra de progresso do nível */}
                    <div className="bg-card border border-primary rounded-2xl p-4">
                        <div className="flex justify-between text-secondary text-xs mb-1"><span>Progresso para Nível {level.level + 1}</span><span>{level.progress.toFixed(0)}%</span></div>
                        <div className="w-full bg-[#2d2d44] rounded-full h-2 overflow-hidden"><div className="bg-gradient-to-r from-green-500 to-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${level.progress}%` }} /></div>
                        <p className="text-secondary text-xs mt-2 text-center">Faltam {level.nextLevel} hábitos para o próximo nível!</p>
                    </div>
                    
                    {/* Melhor hábito */}
                    {bestHabit && (
                        <div className="bg-gradient-to-r from-green-500/20 to-emerald-500/20 rounded-2xl p-4 border border-green-500/30 text-center">
                            <p className="text-secondary text-xs mb-1">🏅 Melhor Hábito</p>
                            <div className="flex items-center justify-center gap-3">
                                <span className="text-3xl">{bestHabit.icon}</span>
                                <div><p className="text-primary font-semibold">{bestHabit.title}</p><p className="text-green-400 text-sm">🔥 {bestHabit.streak} dias consecutivos</p></div>
                            </div>
                        </div>
                    )}
                    
                    {/* Seletor de período */}
                    <div className="flex gap-2">
                        <button onClick={() => { setPeriod('week'); showToast('Mostrando dados desta semana'); }} className={`flex-1 py-2 rounded-xl text-sm font-semibold period-button transition-all ${period === 'week' ? 'period-button-active' : 'bg-[#2d2d44] text-secondary'}`}>📅 Esta Semana</button>
                        <button onClick={() => { setPeriod('month'); showToast('Mostrando dados deste mês'); }} className={`flex-1 py-2 rounded-xl text-sm font-semibold period-button transition-all ${period === 'month' ? 'period-button-active' : 'bg-[#2d2d44] text-secondary'}`}>📆 Este Mês</button>
                    </div>
                    
                    {/* Métrica do período */}
                    <div className="bg-gradient-to-r from-green-500/20 to-emerald-500/20 rounded-2xl p-4 text-center">
                        <p className="text-secondary text-xs">📊 Média por dia neste período</p>
                        <p className="text-3xl font-bold text-primary">{avgPerDay}</p>
                        <p className="text-secondary text-xs">hábitos/dia</p>
                    </div>
                    
                    {/* Stats por categoria */}
                    <div className="bg-card border border-primary rounded-2xl p-4">
                        <h3 className="text-sm font-semibold text-primary mb-3">📂 Hábitos por Categoria</h3>
                        <div className="space-y-2">
                            {Object.entries(categoryStats).map(([cat, count]) => (
                                <div key={cat} className="flex justify-between items-center py-2 border-b border-primary last:border-0">
                                    <span className="text-secondary text-sm capitalize">{cat}</span>
                                    <div className="flex items-center gap-2"><div className="w-32 bg-[#2d2d44] rounded-full h-1.5"><div className="bg-green-500 h-full rounded-full" style={{ width: `${(count / totalCompletions) * 100}%` }} /></div><span className="text-green-400 text-sm font-semibold">{count}</span></div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* Gráficos */}
                    <RadarChart habits={habits} period={period} />
                    <MonthlyChart habits={habits} />
                </div>
            );
        };
        
        // ===== APP PRINCIPAL =====
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState('josiel');
            const [bottomNav, setBottomNav] = React.useState('habits');
            const [theme, setTheme] = React.useState('dark');
            const [names, setNames] = React.useState({ josiel: 'Josiel', zipora: 'Zipora' });
            const [habitsData, setHabitsData] = React.useState({ josiel: [], zipora: [] });
            const [selectedDate, setSelectedDate] = React.useState(new Date());
            const [couplePhoto, setCouplePhoto] = React.useState(null);
            const [modalState, setModalState] = React.useState({ open: false, personId: null });
            const [editModal, setEditModal] = React.useState({ open: false, habit: null });
            
            // Firebase Auth Listener
            React.useEffect(() => {
                const unsubscribe = window.firebaseOnAuthStateChanged(window.firebaseAuth, async (authUser) => {
                    if (authUser) {
                        setUser(authUser);
                        const userRef = window.firebaseRef(window.firebaseDatabase, `users/${authUser.uid}`);
                        
                        const unsubscribeData = window.firebaseOnValue(userRef, (snapshot) => {
                            if (snapshot.exists()) {
                                const data = snapshot.val();
                                setNames(data.names || { josiel: 'Josiel', zipora: 'Zipora' });
                                setHabitsData(data.habits || { josiel: [], zipora: [] });
                                setTheme(data.theme || 'dark');
                                setCouplePhoto(data.photo || null);
                                document.body.className = data.theme === 'light' ? 'light-mode' : '';
                            } else {
                                const initHabits = {
                                    josiel: coupleHabits.map((h, i) => ({ ...h, id: `josiel_${i}`, completedDates: [getToday()], streak: 1, order: i })),
                                    zipora: coupleHabits.map((h, i) => ({ ...h, id: `zipora_${i}`, completedDates: [getToday()], streak: 1, order: i }))
                                };
                                setHabitsData(initHabits);
                                window.firebaseSet(userRef, { names: { josiel: 'Josiel', zipora: 'Zipora' }, habits: initHabits, theme: 'dark', photo: null });
                            }
                        });
                        setLoading(false);
                        return () => unsubscribeData();
                    } else {
                        setUser(null);
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);
            
            const updateFirebase = async (data) => {
                if (user) await window.firebaseUpdate(window.firebaseRef(window.firebaseDatabase, `users/${user.uid}`), data);
            };
            
            const handleNameChange = (personId, newName) => {
                const newNames = { ...names, [personId]: newName };
                setNames(newNames);
                updateFirebase({ names: newNames });
                showToast(`✨ Nome atualizado para ${newName}`);
            };
            
            const handleThemeChange = (newTheme) => {
                setTheme(newTheme);
                document.body.className = newTheme === 'light' ? 'light-mode' : '';
                updateFirebase({ theme: newTheme });
                showToast(newTheme === 'light' ? '☀️ Modo claro ativado' : '🌙 Modo escuro ativado');
            };
            
            const handlePhotoChange = (photo) => {
                setCouplePhoto(photo);
                updateFirebase({ photo });
                showToast('📸 Foto atualizada!');
            };
            
            const addHabit = (personId, habit) => {
                const newHabit = { ...habit, id: `${personId}_${Date.now()}`, completedDates: [], streak: 0, order: habitsData[personId].length };
                const newHabits = { ...habitsData, [personId]: [...habitsData[personId], newHabit] };
                setHabitsData(newHabits);
                updateFirebase({ habits: newHabits });
                showToast(`✅ Hábito "${habit.title}" criado com sucesso!`);
                showConfetti();
            };
            
            const editHabit = (updatedHabit) => {
                const newHabits = { ...habitsData, [activeTab]: habitsData[activeTab].map(h => h.id === updatedHabit.id ? updatedHabit : h) };
                setHabitsData(newHabits);
                updateFirebase({ habits: newHabits });
                showToast(`✏️ Hábito "${updatedHabit.title}" atualizado!`);
            };
            
            const deleteHabit = (habitId) => {
                const deletedHabit = habitsData[activeTab].find(h => h.id === habitId);
                const newHabits = { ...habitsData, [activeTab]: habitsData[activeTab].filter(h => h.id !== habitId) };
                setHabitsData(newHabits);
                updateFirebase({ habits: newHabits });
                showToast(`🗑️ Hábito "${deletedHabit?.title}" removido`);
            };
            
            const toggleHabit = (habitId, date) => {
                const updated = habitsData[activeTab].map(habit => {
                    if (habit.id !== habitId) return habit;
                    const already = habit.completedDates?.includes(date) || false;
                    const newDates = already ? habit.completedDates.filter(d => d !== date) : [...(habit.completedDates || []), date];
                    return { ...habit, completedDates: newDates, streak: calculateStreak(newDates) };
                });
                const toggledHabit = updated.find(h => h.id === habitId);
                const newHabits = { ...habitsData, [activeTab]: updated };
                setHabitsData(newHabits);
                updateFirebase({ habits: newHabits });
                const isCompleted = toggledHabit.completedDates?.includes(date);
                showToast(isCompleted ? '✅ Hábito concluído! Continue assim!' : '⭕ Hábito desmarcado');
                if (isCompleted) showConfetti();
            };
            
            const handleLogout = async () => {
                await window.firebaseSignOut(window.firebaseAuth);
                setUser(null);
                showToast('👋 Até logo! Volte sempre');
            };
            
            if (loading) return <div className="min-h-screen bg-[#0a0a0f] flex items-center justify-center"><div className="loading-spinner"></div></div>;
            if (!user) return <LoginScreen onLogin={() => {}} />;
            
            const getStats = (personId) => {
                const h = habitsData[personId];
                return { total: h.length, completed: h.filter(hh => hh.completedDates?.includes(getToday())).length, streak: h.reduce((a,b)=>a+(b.streak||0),0) };
            };
            
            const josielStats = getStats('josiel');
            const ziporaStats = getStats('zipora');
            const gradientClass = activeTab === 'josiel' ? 'from-blue-500 to-cyan-500' : 'from-pink-500 to-rose-500';
            
            const HabitsView = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <div><h3 className="text-lg font-semibold text-primary">Meus Hábitos</h3><p className="text-secondary text-xs">📅 {formatDate(selectedDate)}</p></div>
                        <button onClick={() => setModalState({ open: true, personId: activeTab })} className={`bg-gradient-to-r ${gradientClass} text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-all hover:shadow-lg hover:scale-105`}><span className="text-lg">+</span><span>Novo Hábito</span></button>
                    </div>
                    {habitsData[activeTab].length === 0 ? (
                        <div className="text-center py-16 bg-card rounded-2xl border border-primary">
                            <div className="text-6xl mb-3">🌱</div>
                            <p className="text-secondary">Nenhum hábito ainda</p>
                            <button onClick={() => setModalState({ open: true, personId: activeTab })} className="mt-3 text-green-400 hover:underline">Criar seu primeiro hábito →</button>
                        </div>
                    ) : (
                        <div className="space-y-3">{habitsData[activeTab].sort((a,b)=>(a.order||0)-(b.order||0)).map((habit, idx) => (<HabitCard key={habit.id} habit={habit} onToggle={toggleHabit} onEdit={(h) => setEditModal({ open: true, habit: h })} onDelete={deleteHabit} selectedDate={selectedDate} index={idx} />))}</div>
                    )}
                </div>

            return (

                    <header className="border-b border-primary bg-[#0f0f1a]/80 backdrop-blur-xl sticky top-0 z-40">

                            <div className="flex items-center justify-between mb-3">

                                        {couplePhoto ? (<img src={couplePhoto} className="w-12 h-12 rounded-full object-cover border-2 border-green-500 shadow-lg" />) : (<div className="w-12 h-12 rounded-full bg-gradient-to-r from-green-500 to-emerald-500 flex items-center justify-center text-2xl shadow-lg">💑</div>)}
                                        <div className="avatar-overlay">📷</div>
                                        <input type="file" id="photoUpload" accept="image/*" className="hidden" onChange={(e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => handlePhotoChange(reader.result); reader.readAsDataURL(file); } }} />
                                    </div>
                                    <div><h1 className="text-2xl font-bold couple-name-highlight">HabitFlow</h1><p className="text-secondary text-xs">Casal Cristão 👑</p></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setActiveTab('josiel')} className={`px-4 py-2 rounded-xl text-sm font-bold transition-all transform hover:scale-105 ${activeTab === 'josiel' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💙 {names.josiel} <span className="ml-1 text-xs">🔥{josielStats.streak}</span></button>
                                    <button onClick={() => setActiveTab('zipora')} className={`px-4 py-2 rounded-xl text-sm font-bold transition-all transform hover:scale-105 ${activeTab === 'zipora' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💖 {names.zipora} <span className="ml-1 text-xs">🔥{ziporaStats.streak}</span></button>
                                    <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-red-500/20 text-red-400 text-sm transition-all hover:bg-red-500/30">🚪 Sair</button>
                                </div>
                            </div>
                            <WeekCalendar selectedDate={selectedDate} onDateSelect={setSelectedDate} habits={habitsData[activeTab]} />
                        </div>
                    </header>
                    
                    <main className="px-4 py-4 max-w-2xl mx-auto">
                        {bottomNav === 'habits' && <HabitsView />}
                        {bottomNav === 'stats' && <StatisticsView habits={habitsData[activeTab]} personName={names[activeTab]} />}
                        {bottomNav === 'settings' && (
                            <div className="space-y-4 pb-20 animate-fade-in-up">
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold mb-3">👤 Perfil</h3><div className="flex gap-2"><input type="text" value={names[activeTab]} onChange={(e) => handleNameChange(activeTab, e.target.value)} className="flex-1 p-2 rounded-xl bg-[#2d2d44] text-primary focus:outline-none focus:ring-2 focus:ring-green-500" /><button onClick={() => handleNameChange(activeTab, names[activeTab])} className="px-4 py-2 bg-green-500 rounded-xl text-white hover:bg-green-600 transition">Salvar</button></div></div>
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold mb-3">🎨 Aparência</h3><div className="flex items-center justify-between"><span className="text-secondary">{theme === 'dark' ? '🌙 Modo Escuro' : '☀️ Modo Claro'}</span><label className="switch"><input type="checkbox" checked={theme === 'light'} onChange={() => handleThemeChange(theme === 'dark' ? 'light' : 'dark')} /><span className="slider"></span></label></div></div>
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold mb-3">ℹ️ Sobre</h3><p className="text-secondary text-sm">Versão 2.0.0</p><p className="text-secondary text-sm mt-1">HabitFlow - Fortalecendo relacionamentos</p></div>
                                <div className="bg-card border border-red-500/30 rounded-2xl p-4"><h3 className="text-red-400 font-semibold mb-3">⚠️ Sair da Conta</h3><button onClick={handleLogout} className="w-full mt-2 py-2 bg-red-500/20 border border-red-500/30 rounded-xl text-red-400 hover:bg-red-500/30 transition">Sair</button></div>
                            </div>
                        )}
                    </main>
                    
                    <div className="bottom-nav">
                        <div className="flex justify-center gap-8 max-w-md mx-auto">
                            <div onClick={() => setBottomNav('habits')} className={`bottom-nav-item ${bottomNav === 'habits' ? 'bottom-nav-active' : 'bottom-nav-inactive'}`}><span className="text-2xl">📋</span><span className="text-xs font-medium">Hábitos</span></div>
                            <div onClick={() => setBottomNav('stats')} className={`bottom-nav-item ${bottomNav === 'stats' ? 'bottom-nav-active' : 'bottom-nav-inactive'}`}><span className="text-2xl">📊</span><span className="text-xs font-medium">Estatísticas</span></div>
                            <div onClick={() => setBottomNav('settings')} className={`bottom-nav-item ${bottomNav === 'settings' ? 'bottom-nav-active' : 'bottom-nav-inactive'}`}><span className="text-2xl">⚙️</span><span className="text-xs font-medium">Configurações</span></div>
                        </div>
                    </div>
                    
                    {/* Modal Novo Hábito */}
                    {modalState.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in-up" onClick={() => setModalState({ open: false, personId: null })}>
                            <div className="glass-effect rounded-2xl p-6 max-w-md w-full transform transition-all" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-primary mb-4">✨ Criar Novo Hábito</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const form = e.target;
                                    addHabit(modalState.personId, {
                                        title: form.title.value,
                                        description: form.desc.value,
                                        icon: form.icon.value,
                                        tag: form.tag.value,
                                        frequency: { type: 'daily' },
                                        completedDates: [],
                                        streak: 0
                                    });
                                    setModalState({ open: false, personId: null });
                                }} className="space-y-4">
                                    <div><label className="text-secondary text-sm block mb-1">Ícone</label><select name="icon" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary focus:outline-none focus:ring-2 focus:ring-green-500">{allEmojis.map(em => <option key={em} value={em}>{em}</option>)}</select></div>
                                    <div><label className="text-secondary text-sm block mb-1">Nome do Hábito</label><input name="title" placeholder="Ex: Ler a Bíblia" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary focus:outline-none focus:ring-2 focus:ring-green-500" required /></div>
                                    <div><label className="text-secondary text-sm block mb-1">Descrição</label><textarea name="desc" placeholder="Descreva seu hábito..." rows="2" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary focus:outline-none focus:ring-2 focus:ring-green-500"></textarea></div>
                                    <div><label className="text-secondary text-sm block mb-1">Categoria</label><select name="tag" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary"><option value="amor">💖 Amor</option><option value="comunicação">💬 Comunicação</option><option value="espiritual">✝️ Espiritual</option><option value="saúde">💪 Saúde</option><option value="relacionamento">💑 Relacionamento</option></select></div>
                                    <div className="flex gap-3 pt-2"><button type="button" onClick={() => setModalState({ open: false, personId: null })} className="flex-1 py-2.5 rounded-xl bg-[#2d2d44] text-secondary hover:bg-[#3d3d55] transition">Cancelar</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold transition-all hover:shadow-lg">Criar Hábito</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* Modal Editar Hábito */}
                    {editModal.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in-up" onClick={() => setEditModal({ open: false, habit: null })}>
                            <div className="glass-effect rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-primary mb-4">✏️ Editar Hábito</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    editHabit({ ...editModal.habit, title: e.target.title.value, description: e.target.desc.value, icon: e.target.icon.value, tag: e.target.tag.value });
                                    setEditModal({ open: false, habit: null });
                                }} className="space-y-4">
                                    <div><label className="text-secondary text-sm block mb-1">Ícone</label><select name="icon" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary">{allEmojis.map(em => <option key={em} value={em} selected={editModal.habit?.icon === em}>{em}</option>)}</select></div>
                                    <div><label className="text-secondary text-sm block mb-1">Nome</label><input name="title" defaultValue={editModal.habit?.title} className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary" required /></div>
                                    <div><label className="text-secondary text-sm block mb-1">Descrição</label><textarea name="desc" defaultValue={editModal.habit?.description} rows="2" className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary"></textarea></div>
                                    <div><label className="text-secondary text-sm block mb-1">Categoria</label><select name="tag" defaultValue={editModal.habit?.tag} className="w-full p-2.5 rounded-xl bg-[#2d2d44] text-primary"><option value="amor">Amor</option><option value="comunicação">Comunicação</option><option value="espiritual">Espiritual</option><option value="saúde">Saúde</option><option value="relacionamento">Relacionamento</option></select></div>
                                    <div className="flex gap-3"><button type="button" onClick={() => setEditModal({ open: false, habit: null })} className="flex-1 py-2.5 rounded-xl bg-[#2d2d44] text-secondary hover:bg-[#3d3d55] transition">Cancelar</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-green-500 text-white font-semibold hover:bg-green-600 transition">Salvar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
