        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFz57Ku9PqgZzLe9DF1CFKDGz740TvwjA",
            authDomain: "habitflow-casal-57723.firebaseapp.com",
            databaseURL: "https://habitflow-casal-57723-default-rtdb.firebaseio.com",
            projectId: "habitflow-casal-57723",
            storageBucket: "habitflow-casal-57723.firebasestorage.app",
            messagingSenderId: "205690500990",
            appId: "1:205690500990:web:4afcaeef3e297dc351a52f"

        const app = initializeApp(firebaseConfig);

        window.firebaseAuth = auth;

    <style>

        .check-button-pending {

        .bottom-nav {

        .bottom-nav-item {

</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // ===== UTILITÁRIOS =====
        const getToday = () => new Date().toISOString().split('T')[0];
        const formatDate = (date) => new Date(date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        const formatDayName = (date) => date.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');

        const getWeekDays = () => {
            const today = new Date();
            const weekDays = [];
            for (let i = 3; i >= 0; i--) {
                const date = new Date();
                date.setDate(today.getDate() - i);
                weekDays.push(date);
            }
            for (let i = 1; i <= 3; i++) {
                const date = new Date();
                date.setDate(today.getDate() + i);
                weekDays.push(date);
            }
            return weekDays.sort((a, b) => a - b);
        };

        const calculateStreak = (dates) => {
            if (!dates || dates.length === 0) return 0;
            const sorted = [...dates].sort().reverse();
            let streak = 1;
            let current = new Date(sorted[0]);
            for (let i = 1; i < sorted.length; i++) {
                const prev = new Date(sorted[i]);
                const diffDays = Math.floor((current - prev) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) { streak++; current = prev; }
                else break;
            }
            return streak;
        };

        // ===== HÁBITOS DO CASAL =====
        const coupleHabits = [
            { title: 'Elogiar o parceiro', description: 'Diga algo positivo', icon: '❤️', tag: 'amor', frequency: { type: 'daily' } },
            { title: 'Conversar sem celular', description: 'Momento sem distrações', icon: '💬', tag: 'comunicação', frequency: { type: 'daily' } },
            { title: 'Gratidão diária', description: 'Agradecer a Deus', icon: '🙏', tag: 'espiritual', frequency: { type: 'daily' } },
            { title: 'Mensagem carinhosa', description: 'Enviar mensagem', icon: '💌', tag: 'amor', frequency: { type: 'daily' } },
            { title: 'Tempo de qualidade', description: 'Dedicar tempo ao casal', icon: '💑', tag: 'relacionamento', frequency: { type: 'daily' } },
            { title: 'Oração juntos', description: 'Orar em casal', icon: '✝️', tag: 'espiritual', frequency: { type: 'daily' } },
            { title: 'Ler a Bíblia', description: 'Devocional diário', icon: '📖', tag: 'espiritual', frequency: { type: 'daily' } },
            { title: 'Exercício físico', description: 'Praticar atividade', icon: '🏃', tag: 'saúde', frequency: { type: 'daily' } },
            { title: 'Dormir bem', description: '7-8 horas de sono', icon: '😴', tag: 'saúde', frequency: { type: 'daily' } },
            { title: 'Planejamento financeiro', description: 'Organizar finanças', icon: '💰', tag: 'finanças', frequency: { type: 'weekly', day: 1 } }
        ];

        const allEmojis = ['❤️', '💬', '🙏', '💌', '💑', '✝️', '📖', '🏃', '😴', '💰', '🎯', '🚶', '💖', '🎉', '⭐', '✨', '🌟', '💪', '🧘', '🥗'];

        // ===== COMPONENTES =====
        const WeekCalendar = ({ selectedDate, onDateSelect, habits }) => {
            const weekDays = getWeekDays();
            const today = new Date();
            const isDateCompleted = (date) => habits.some(h => h.completedDates?.includes(date.toISOString().split('T')[0]));
            return (
                <div className="bg-card border border-primary rounded-2xl p-3">
                    <div className="week-calendar">
                        {weekDays.map((day, idx) => {
                            const isSelected = selectedDate && day.toDateString() === new Date(selectedDate).toDateString();
                            return (
                                <div key={idx} onClick={() => onDateSelect(day)} className={`week-day ${isSelected ? 'week-day-selected' : ''} ${isDateCompleted(day) ? 'week-day-completed' : ''}`}>
                                    <div className="text-xs font-medium">{formatDayName(day)}</div>
                                    <div className={`text-lg font-bold ${day.toDateString() === today.toDateString() && !isSelected ? 'text-green-400' : 'text-primary'}`}>{day.getDate()}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const HabitCard = ({ habit, onToggle, onEdit, onDelete, selectedDate }) => {
            const dateToCheck = selectedDate ? selectedDate.toISOString().split('T')[0] : getToday();
            const completedOnDate = habit.completedDates?.includes(dateToCheck) || false;
            const [showMenu, setShowMenu] = React.useState(false);
            const [menuPos, setMenuPos] = React.useState({ x: 0, y: 0 });

            const getFreqText = () => {
                if (!habit.frequency) return '📅 Todo dia';
                if (habit.frequency.type === 'daily') return '📅 Todo dia';
                if (habit.frequency.type === 'weekly') return `📆 ${['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'][habit.frequency.day]}`;
                return `🔄 A cada ${habit.frequency.interval} dias`;
            };

            return (
                <>
                    <div className="bg-card border border-primary rounded-2xl p-3">
                        <div className="flex items-start gap-3">
                            <div className="flex-1">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl">{habit.icon}</span>
                                    <div><h3 className="text-primary font-semibold text-sm">{habit.title}</h3><p className="text-secondary text-xs">{getFreqText()}</p></div>
                                </div>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="text-xs text-orange-400">🔥 {habit.streak || 0}</span>
                                    <span className="text-secondary text-xs">✅ {habit.completedDates?.length || 0}</span>
                                    <span className="text-xs text-green-400">{habit.tag}</span>
                                </div>
                            </div>
                            <div className="flex flex-col items-center gap-1">
                                <button onClick={(e) => { e.stopPropagation(); setMenuPos({ x: e.clientX, y: e.clientY }); setShowMenu(true); }} className="text-secondary text-xl">⋮</button>
                                <button onClick={() => onToggle(habit.id, dateToCheck)} className={`check-button ${completedOnDate ? 'check-button-completed' : 'check-button-pending'}`} style={{ width: '40px', height: '40px', fontSize: '20px' }}>
                                    {completedOnDate ? '✓' : '○'}
                                </button>
                            </div>
                        </div>
                    </div>
                    {showMenu && (
                        <div className="context-menu" style={{ top: menuPos.y - 60, left: menuPos.x - 120 }}>
                            <div className="context-menu-item" onClick={() => { onEdit(habit); setShowMenu(false); }}>✏️ Editar</div>
                            <div className="context-menu-item delete" onClick={() => { if (confirm(`Deletar "${habit.title}"?`)) onDelete(habit.id); setShowMenu(false); }}>🗑️ Deletar</div>
                        </div>
                    )}
                </>
            );
        };

        // ===== TELA DE LOGIN =====
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [isRegister, setIsRegister] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    if (isRegister) {
                        await window.firebaseCreateUser(window.firebaseAuth, email, password);
                    } else {
                        await window.firebaseSignIn(window.firebaseAuth, email, password);
                    }
                    onLogin();
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-[#0a0a0f] to-[#0f0f1a] flex items-center justify-center p-4">
                    <div className="glass-effect rounded-3xl p-8 max-w-md w-full border border-primary animate-fade-in">
                        <div className="text-center mb-6">
                            <div className="text-6xl mb-3">💑</div>
                            <h1 className="text-3xl font-bold couple-name-highlight">HabitFlow</h1>
                            <p className="text-secondary text-sm mt-2">Casal Cristão</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:border-green-500" required />
                            <input type="password" placeholder="Senha" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:border-green-500" required />
                            {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                            <button type="submit" disabled={loading} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl font-semibold">
                                {loading ? 'Carregando...' : (isRegister ? 'Criar Conta' : 'Entrar')}
                            </button>
                            <p className="text-center text-secondary text-sm">
                                {isRegister ? 'Já tem conta?' : 'Não tem conta?'}{' '}
                                <button type="button" onClick={() => setIsRegister(!isRegister)} className="text-green-400">{isRegister ? 'Fazer login' : 'Cadastre-se'}</button>
                            </p>
                        </form>
                    </div>
                </div>
            );
        };

        // ===== APP PRINCIPAL =====
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState('josiel');
            const [bottomNav, setBottomNav] = React.useState('habits');
            const [theme, setTheme] = React.useState('dark');
            const [names, setNames] = React.useState({ josiel: 'Josiel', zipora: 'Zipora' });
            const [habitsData, setHabitsData] = React.useState({ josiel: [], zipora: [] });
            const [selectedDate, setSelectedDate] = React.useState(new Date());
            const [couplePhoto, setCouplePhoto] = React.useState(null);
            const [modalState, setModalState] = React.useState({ open: false, personId: null });
            const [editModal, setEditModal] = React.useState({ open: false, habit: null });

            // Firebase Auth Listener
            React.useEffect(() => {
                const unsubscribe = window.firebaseOnAuthStateChanged(window.firebaseAuth, async (user) => {
                    if (user) {
                        setUser(user);
                        // Carregar dados do Firebase
                        const snapshot = await window.firebaseGet(window.firebaseRef(window.firebaseDatabase, `users/${user.uid}`));
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            setNames(data.names || { josiel: 'Josiel', zipora: 'Zipora' });
                            setHabitsData(data.habits || { josiel: [], zipora: [] });
                            setTheme(data.theme || 'dark');
                            setCouplePhoto(data.photo || null);
                            document.body.className = data.theme === 'light' ? 'light-mode' : '';
                        } else {
                            // Dados iniciais
                            const initHabits = {
                                josiel: coupleHabits.map((h, i) => ({ ...h, id: `josiel_${i}`, completedDates: [getToday()], streak: 1, order: i })),
                                zipora: coupleHabits.map((h, i) => ({ ...h, id: `zipora_${i}`, completedDates: [getToday()], streak: 1, order: i }))
                            };
                            setHabitsData(initHabits);
                            await window.firebaseSet(window.firebaseRef(window.firebaseDatabase, `users/${user.uid}`), { names, habits: initHabits, theme: 'dark', photo: null });
                        }
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const saveToFirebase = async (data) => {
                if (user) await window.firebaseUpdate(window.firebaseRef(window.firebaseDatabase, `users/${user.uid}`), data);
            };

            React.useEffect(() => { if (user) saveToFirebase({ names }); }, [names]);
            React.useEffect(() => { if (user) saveToFirebase({ habits: habitsData }); }, [habitsData]);
            React.useEffect(() => { if (user) { document.body.className = theme === 'light' ? 'light-mode' : ''; saveToFirebase({ theme }); } }, [theme]);
            React.useEffect(() => { if (user && couplePhoto) saveToFirebase({ photo: couplePhoto }); }, [couplePhoto]);

            const showToast = (msg) => {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-20 left-4 right-4 bg-green-500 text-white px-4 py-2 rounded-xl shadow-lg animate-fade-in z-50 text-center text-sm';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            };

            const handleLogout = async () => { await window.firebaseSignOut(window.firebaseAuth); setUser(null); showToast('👋 Até logo!'); };
            const handleNameChange = (personId, newName) => { setNames(prev => ({ ...prev, [personId]: newName })); showToast(`✨ Nome atualizado!`); };

            const addHabit = (personId, habit) => {
                const newHabit = { ...habit, id: `${personId}_${Date.now()}`, completedDates: [], streak: 0, order: habitsData[personId].length };
                setHabitsData(prev => ({ ...prev, [personId]: [...prev[personId], newHabit] }));
                showToast(`✅ Hábito criado!`);
            };

            const editHabit = (updated) => { setHabitsData(prev => ({ ...prev, [activeTab]: prev[activeTab].map(h => h.id === updated.id ? updated : h) })); showToast(`✏️ Hábito atualizado!`); };
            const deleteHabit = (id) => { setHabitsData(prev => ({ ...prev, [activeTab]: prev[activeTab].filter(h => h.id !== id) })); showToast(`🗑️ Hábito deletado!`); };

            const toggleHabit = (habitId, date) => {
                const updated = habitsData[activeTab].map(habit => {
                    if (habit.id !== habitId) return habit;
                    const already = habit.completedDates?.includes(date) || false;
                    const newDates = already ? habit.completedDates.filter(d => d !== date) : [...(habit.completedDates || []), date];
                    return { ...habit, completedDates: newDates, streak: calculateStreak(newDates) };
                });
                setHabitsData(prev => ({ ...prev, [activeTab]: updated }));
                showToast('✅ Hábito atualizado!');
            };

            if (loading) return <div className="min-h-screen bg-[#0a0a0f] flex items-center justify-center"><div className="text-green-400 text-xl">Carregando...</div></div>;
            if (!user) return <LoginScreen onLogin={() => { }} />;

            const getStats = (personId) => {
                const h = habitsData[personId];
                return { total: h.length, completed: h.filter(hh => hh.completedDates?.includes(getToday())).length, streak: h.reduce((a, b) => a + (b.streak || 0), 0) };
            };

            const josielStats = getStats('josiel');
            const ziporaStats = getStats('zipora');
            const gradientClass = activeTab === 'josiel' ? 'from-blue-500 to-cyan-500' : 'from-pink-500 to-rose-500';

            const HabitsView = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <div><h3 className="text-lg font-semibold text-primary">Meus Hábitos</h3><p className="text-secondary text-xs">{formatDate(selectedDate)}</p></div>
                        <button onClick={() => setModalState({ open: true, personId: activeTab })} className={`bg-gradient-to-r ${gradientClass} text-white px-3 py-1.5 rounded-xl text-sm font-semibold flex items-center gap-1`}><span>+</span><span>Novo</span></button>
                    </div>
                    {habitsData[activeTab].length === 0 ? (<div className="text-center py-12"><p className="text-secondary">Nenhum hábito</p></div>) :
                        (<div className="space-y-2">{habitsData[activeTab].sort((a, b) => (a.order || 0) - (b.order || 0)).map(habit => (<HabitCard key={habit.id} habit={habit} onToggle={toggleHabit} onEdit={(h) => setEditModal({ open: true, habit: h })} onDelete={deleteHabit} selectedDate={selectedDate} />))}</div>)}
                </div>
            );

            return (
                <div className="min-h-screen bg-gradient-to-br from-[#0a0a0f] via-[#0f0f1a] to-[#0a0a0f] pb-24">
                    <header className="border-b border-primary bg-[#0f0f1a]/80 backdrop-blur-sm sticky top-0 z-40">
                        <div className="px-4 py-3">
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-3">
                                    <div className="avatar-container relative" onClick={() => document.getElementById('photoUpload').click()}>
                                        {couplePhoto ? (<img src={couplePhoto} className="w-12 h-12 rounded-full object-cover border-2 border-green-500" />) : (<div className="w-12 h-12 rounded-full bg-gradient-to-r from-green-500 to-emerald-500 flex items-center justify-center text-2xl">💑</div>)}
                                        <div className="avatar-overlay">📷</div>
                                        <input type="file" id="photoUpload" accept="image/*" className="hidden" onChange={(e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => setCouplePhoto(reader.result); reader.readAsDataURL(file); } }} />
                                    </div>
                                    <div><h1 className="text-2xl font-bold couple-name-highlight">HabitFlow</h1><p className="text-secondary text-xs">Casal Cristão 👑</p></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setActiveTab('josiel')} className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'josiel' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💙 {names.josiel} 🔥{josielStats.streak}</button>
                                    <button onClick={() => setActiveTab('zipora')} className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'zipora' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💖 {names.zipora} 🔥{ziporaStats.streak}</button>
                                    <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-red-500/20 text-red-400 text-sm">🚪 Sair</button>
                                </div>
                            </div>
                            <WeekCalendar selectedDate={selectedDate} onDateSelect={setSelectedDate} habits={habitsData[activeTab]} />
                        </div>
                    </header>

                    <main className="px-4 py-3 max-w-2xl mx-auto">
                        {bottomNav === 'habits' && <HabitsView />}
                        {bottomNav === 'settings' && (
                            <div className="space-y-4 pb-20">
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold">👤 Perfil</h3><div className="flex gap-2 mt-2"><input type="text" value={names[activeTab]} onChange={(e) => handleNameChange(activeTab, e.target.value)} className="flex-1 p-2 rounded-xl bg-[#2d2d44] text-primary" /><button onClick={() => handleNameChange(activeTab, names[activeTab])} className="px-4 py-2 bg-green-500 rounded-xl text-white">Salvar</button></div></div>
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold">🎨 Tema</h3><div className="flex items-center justify-between mt-2"><span className="text-secondary">{theme === 'dark' ? 'Escuro' : 'Claro'}</span><label className="switch"><input type="checkbox" checked={theme === 'light'} onChange={() => setTheme(theme === 'dark' ? 'light' : 'dark')} /><span className="slider"></span></label></div></div>
                                <div className="bg-card border border-red-500/30 rounded-2xl p-4"><h3 className="text-red-400 font-semibold">⚠️ Sair</h3><button onClick={handleLogout} className="w-full mt-2 py-2 bg-red-500/20 rounded-xl text-red-400">Sair da Conta</button></div>
                            </div>
                        )}
                    </main>

                    <div className="bottom-nav">
                        <div className="flex justify-center gap-8 max-w-md mx-auto">
                            <div onClick={() => setBottomNav('habits')} className={`bottom-nav-item ${bottomNav === 'habits' ? 'bottom-nav-active' : 'bottom-nav-inactive'}`}><span className="text-2xl">📋</span><span>Hábitos</span></div>
                            <div onClick={() => setBottomNav('settings')} className={`bottom-nav-item ${bottomNav === 'settings' ? 'bottom-nav-active' : 'bottom-nav-inactive'}`}><span className="text-2xl">⚙️</span><span>Config</span></div>
                        </div>
                    </div>

                    {/* Modal Novo Hábito */}
                    {modalState.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setModalState({ open: false, personId: null })}>
                            <div className="glass-effect rounded-2xl p-5 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-primary mb-2">✨ Novo Hábito</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const form = e.target;
                                    addHabit(modalState.personId, {
                                        title: form.title.value,
                                        description: form.desc.value,
                                        icon: form.icon.value,
                                        tag: form.tag.value,
                                        frequency: { type: form.freq.value === 'daily' ? 'daily' : 'weekly', day: parseInt(form.day?.value || 0) },
                                        completedDates: [],
                                        streak: 0
                                    });
                                    setModalState({ open: false, personId: null });
                                }} className="space-y-3">
                                    <div><label className="text-secondary text-xs">Ícone</label><select name="icon" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary">{allEmojis.map(em => <option key={em} value={em}>{em}</option>)}</select></div>
                                    <div><input name="title" placeholder="Nome" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary" required /></div>
                                    <div><textarea name="desc" placeholder="Descrição" rows="2" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"></textarea></div>
                                    <div><select name="tag" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"><option value="amor">Amor</option><option value="espiritual">Espiritual</option><option value="saúde">Saúde</option></select></div>
                                    <div><select name="freq" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"><option value="daily">Todo dia</option><option value="weekly">Semanal</option></select></div>
                                    <div className="flex gap-3"><button type="button" onClick={() => setModalState({ open: false, personId: null })} className="flex-1 py-2 rounded-xl bg-[#2d2d44] text-secondary">Cancelar</button><button type="submit" className="flex-1 py-2 rounded-xl bg-green-500 text-white">Criar</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Editar Hábito */}
                    {editModal.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setEditModal({ open: false, habit: null })}>
                            <div className="glass-effect rounded-2xl p-5 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-primary mb-2">✏️ Editar Hábito</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    editHabit({ ...editModal.habit, title: e.target.title.value, description: e.target.desc.value, icon: e.target.icon.value, tag: e.target.tag.value });
                                    setEditModal({ open: false, habit: null });
                                }} className="space-y-3">
                                    <div><label className="text-secondary text-xs">Ícone</label><select name="icon" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary">{allEmojis.map(em => <option key={em} value={em} selected={editModal.habit?.icon === em}>{em}</option>)}</select></div>
                                    <div><input name="title" defaultValue={editModal.habit?.title} className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary" required /></div>
                                    <div><textarea name="desc" defaultValue={editModal.habit?.description} rows="2" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"></textarea></div>
                                    <div><select name="tag" defaultValue={editModal.habit?.tag} className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"><option value="amor">Amor</option><option value="espiritual">Espiritual</option><option value="saúde">Saúde</option></select></div>
                                    <div className="flex gap-3"><button type="button" onClick={() => setEditModal({ open: false, habit: null })} className="flex-1 py-2 rounded-xl bg-[#2d2d44] text-secondary">Cancelar</button><button type="submit" className="flex-1 py-2 rounded-xl bg-green-500 text-white">Salvar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
