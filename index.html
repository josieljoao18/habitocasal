    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#0a0a0f;--bg-card:rgba(20,20,35,0.85);--text-primary:#e8e8f0;--text-secondary:#9ca3af;--border-primary:#2d2d44;--bg-button:#2d2d44;--bg-input:#2d2d44;--green-gradient:linear-gradient(135deg,#10b981,#059669);--green-shadow:rgba(16,185,129,0.5)}
        body.light-mode{--bg-primary:#f0f2f5;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#6b6b7a;--border-primary:#e4e6eb;--bg-button:#e8e8f0;--bg-input:#f0f2f5}
        body{background:var(--bg-primary);font-family:'Inter',system-ui;transition:background .3s,color .3s;min-height:100vh}
        .text-primary{color:var(--text-primary)}.text-secondary{color:var(--text-secondary)}.border-primary{border-color:var(--border-primary)}
        .bg-card{background:var(--bg-card);backdrop-filter:blur(12px);border-radius:1rem;border:1px solid var(--border-primary)}
        .bg-input{background:var(--bg-input)}.glass-effect{background:var(--bg-card);backdrop-filter:blur(20px)}
        .check-button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;border:none;transition:all .15s;cursor:pointer}
        .check-button:active{transform:scale(0.9)}.check-button-completed{background:var(--green-gradient);color:white;box-shadow:0 0 14px var(--green-shadow)}.check-button-pending{background:var(--bg-button);color:var(--text-secondary);border:2px solid var(--border-primary)}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,25,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border-primary);padding:6px 4px;z-index:50;display:flex;justify-content:center;gap:4px}
        body.light-mode .bottom-nav{background:rgba(255,255,255,.98)}
        .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:16px;transition:.2s;cursor:pointer;font-size:.6rem;min-width:42px}.bottom-nav-active{background:rgba(16,185,129,.15);color:#10b981;transform:translateY(-2px)}
        .week-calendar{display:flex;gap:3px;overflow-x:auto;padding:4px 0}.week-day{flex-shrink:0;width:36px;text-align:center;padding:4px 2px;border-radius:10px;transition:.2s;cursor:pointer;font-size:.65rem}.week-day:hover{background:rgba(16,185,129,.15)}.week-day-selected{background:var(--green-gradient);color:white}
        .couple-name-highlight{background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
        .switch{position:relative;display:inline-block;width:42px;height:22px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--border-primary);transition:.3s;border-radius:34px}.slider:before{position:absolute;content:"🌙";display:flex;align-items:center;justify-content:center;height:18px;width:18px;left:2px;bottom:2px;background-color:white;transition:.3s;border-radius:50%;font-size:8px}input:checked+.slider{background-color:#10b981}input:checked+.slider:before{transform:translateX(20px);content:"☀️"}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:6px 14px;border-radius:30px;font-size:12px;z-index:1000;animation:fadeInUp .3s}@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .top-notification{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;animation:slideDown .3s ease-out;pointer-events:none}@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .top-notification-content{background:rgba(16,185,129,.95);backdrop-filter:blur(10px);color:white;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:4px;max-width:90vw}
        .loading-spinner{width:32px;height:32px;border:3px solid var(--border-primary);border-top-color:#10b981;border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
        .progress-bar-bg{width:100%;height:5px;background:var(--bg-button);border-radius:8px;overflow:hidden}.progress-bar-fill{height:100%;border-radius:8px;transition:width .5s}
        .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:100px;overflow-y:auto;padding:4px;background:var(--bg-button);border-radius:10px}
        .emoji-btn{font-size:18px;padding:3px;border-radius:8px;background:var(--bg-input);text-align:center;cursor:pointer;transition:.2s}.emoji-btn:hover{transform:scale(1.1);background:#10b981}.emoji-btn.selected{background:#10b981}
        .photo-circle{width:38px;height:38px;border-radius:50%;overflow:hidden;cursor:pointer;position:relative;border:2px solid #10b981;transition:.3s;flex-shrink:0}.photo-circle:hover{border-color:#34d399;box-shadow:0 0 14px rgba(16,185,129,.4);transform:scale(1.05)}
        .photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.3s;font-size:14px;color:white;border-radius:50%}.photo-circle:hover .photo-overlay{opacity:1}
        .mood-btn{transition:all .2s;cursor:pointer;padding:4px;border-radius:8px;font-size:1.2rem}.mood-btn:hover{transform:scale(1.15)}.mood-btn.selected{background:rgba(16,185,129,.2);box-shadow:0 0 10px rgba(16,185,129,.3)}
        .notif-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:white;font-size:.5rem;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
        .notif-panel{position:fixed;top:45px;right:8px;width:260px;max-height:60vh;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-primary);border-radius:14px;z-index:999;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
        .task-check{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;border:none;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;flex-shrink:0}.task-check:active{transform:scale(0.85)}.task-check-done{background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 0 10px rgba(16,185,129,0.4)}.task-check-todo{background:transparent;color:var(--text-secondary);border:2px solid #3d3d55}.task-check-todo:hover{border-color:#10b981;color:#10b981;background:rgba(16,185,129,0.08)}
        @media(max-width:640px){.check-button{width:32px;height:32px;font-size:16px}.photo-circle{width:32px;height:32px}}
    </style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, memo, useRef } = React;

// ===================== UTILITÁRIOS =====================
const getToday = () => new Date().toISOString().split('T')[0];
const formatDate = d => new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const formatDayName = d => d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const getWeekDays = () => {
    const today = new Date(); const days = [];
    for(let i=3;i>=0;i--){const d=new Date();d.setDate(today.getDate()-i);days.push(d)}
    for(let i=1;i<=3;i++){const d=new Date();d.setDate(today.getDate()+i);days.push(d)}
    return days.sort((a,b)=>a-b);
};
const isHabitActiveOnDate = (habit, dateStr) => {
    if(!habit||!dateStr) return false;
    if(!habit.frequency||habit.frequency.type==='daily') return true;
    const date = new Date(dateStr+'T00:00:00');
    if(habit.frequency.type==='weekly') return habit.frequency.day===date.getDay();
    if(habit.frequency.type==='custom'){
        const interval=habit.frequency.interval||2;
        const start=habit.createdAt?new Date(habit.createdAt.split('T')[0]+'T00:00:00'):new Date('2024-01-01T00:00:00');
        return Math.floor((date-start)/86400000)%interval===0;
    }
    return true;
};
const calculateStreak = (dates, frequency) => {
    if(!Array.isArray(dates)||dates.length===0) return 0;
    const sorted=[...dates].sort((a,b)=>b.localeCompare(a));
    const today=getToday();
    if(!frequency||frequency.type==='daily'){
        let streak=0;const check=new Date(today+'T00:00:00');
        const todayOk=sorted.includes(today);
        const yesterday=new Date(check);yesterday.setDate(yesterday.getDate()-1);
        if(!todayOk&&!sorted.includes(yesterday.toISOString().split('T')[0])) return 0;
        let cur=todayOk?new Date(today+'T00:00:00'):yesterday;
        while(sorted.includes(cur.toISOString().split('T')[0])){streak++;cur.setDate(cur.getDate()-1)}
        return streak;
    }
    return 0;
};
const playSound = () => {try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2)}catch(e){}}
const triggerConfetti = () => {if(typeof confetti!=='undefined')confetti({particleCount:60,spread:60,origin:{y:.6},colors:['#10b981','#059669','#34d399']})}
const vibrate = () => {if(navigator.vibrate)navigator.vibrate(30)}
const showToast = (msg, err=false) => {const el=document.createElement('div');el.className='toast';el.style.background=err?'#ef4444':'#10b981';el.innerText=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2000)}
let topTimer=null;
const showTopNotification = (msg, icon='🔔') => {
    const old=document.querySelector('.top-notification');if(old)old.remove();if(topTimer)clearTimeout(topTimer);
    const el=document.createElement('div');el.className='top-notification';
    el.innerHTML=`<div class="top-notification-content"><span>${icon}</span><span>${msg}</span></div>`;
    document.body.appendChild(el);
    topTimer=setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-20px)';setTimeout(()=>el.remove(),300)},2000)
};
const ensureArray = val => Array.isArray(val)?val:(typeof val==='object'&&val!==null?Object.values(val):[]);
const normalizeHabits = habitsObj => {
    const result={josiel:[],zipora:[]};
    if(!habitsObj) return result;
    for(const person of['josiel','zipora']){
        const raw=habitsObj[person];
        const list=Array.isArray(raw)?raw:(typeof raw==='object'&&raw!==null?Object.values(raw):[]);
        result[person]=list.map(h=>({...h,completedDates:ensureArray(h?.completedDates)}));
    }
    return result;
};
const compressImage = file => new Promise(resolve=>{
    const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let w=img.width,h=img.height;const max=300;if(w>max||h>max){if(w>h){h=(h/w)*max;w=max}else{w=(w/h)*max;h=max}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',0.5))};img.src=e.target.result};reader.readAsDataURL(file)
});

const ALL_EMOJIS = ['❤️','💬','🙏','✝️','📖','💌','💑','🧠','🏃','😴','🍽️','💰','🎯','🚶','🤝','💖','🎉','💪','🧘','🥗','⭐','✨','🌟'];
const TASK_EMOJIS = ['📋','🗓️','🛒','💊','🚗','📞','💰','🎯','📝','🏠','❤️','🙏'];

// ===================== COMPONENTES =====================
const HomePage = ({onStart}) => (
    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <div className="w-24 h-24 bg-gradient-to-r from-green-500 to-emerald-600 rounded-3xl flex items-center justify-center text-5xl mb-6 shadow-xl">💑</div>
        <h1 className="text-4xl font-bold mb-2"><span className="couple-name-highlight">HabitFlow‑Casal</span></h1>
        <p className="text-secondary mb-8">Hábitos e Tarefas para Casais Cristãos</p>
        <button onClick={onStart} className="px-10 py-4 bg-green-500 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition">✨ Começar</button>
    </div>
);

const DailyProgress = memo(({habits, date}) => {
    const ds=date.toISOString().split('T')[0];const active=habits.filter(h=>isHabitActiveOnDate(h,ds));
    const done=active.filter(h=>h.completedDates?.includes(ds)).length;
    if(!active.length) return null;
    const pct=(done/active.length)*100;
    return <div className="bg-card p-2 mb-2"><div className="flex justify-between mb-1"><span className="text-secondary text-[10px]">Progresso</span><span className="text-primary text-[10px] font-semibold">{done}/{active.length}{pct===100?' 🎉':''}</span></div><div className="progress-bar-bg"><div className="progress-bar-fill" style={{width:`${pct}%`,background:pct===100?'linear-gradient(135deg,#fbbf24,#f59e0b)':'var(--green-gradient)'}}></div></div></div>
});

const WeekCalendar = memo(({selectedDate, onSelect, habits}) => {
    const week=getWeekDays();const today=new Date();
    return <div className="bg-card p-1.5"><div className="week-calendar">{week.map((day,idx)=>{const ds=day.toISOString().split('T')[0];const sel=selectedDate?.toDateString()===day.toDateString();const active=habits.filter(h=>isHabitActiveOnDate(h,ds));const done=active.filter(h=>h.completedDates?.includes(ds)).length;const total=active.length;let bg='';if(total>0){if(done===total)bg='bg-green-500/20';else if(done>0)bg='bg-yellow-500/20'}return <div key={idx} onClick={()=>onSelect(day)} className={`week-day ${bg} ${sel?'week-day-selected':''}`}><div className="text-xs">{formatDayName(day)}</div><div className={`font-bold ${day.toDateString()===today.toDateString()&&!sel?'text-green-400':''}`}>{day.getDate()}</div>{done>0&&<div className="text-[9px] text-green-400">{done}/{total}</div>}</div>})}</div></div>
});

const HabitCard = memo(({habit, onToggle, onEdit, onDelete, onMoveUp, onMoveDown, dateStr, isFirst, isLast}) => {
    const dates=ensureArray(habit.completedDates);const completed=dates.includes(dateStr);const active=isHabitActiveOnDate(habit,dateStr);
    const [flash,setFlash]=useState(false);
    const freqText=useMemo(()=>{const f=habit.frequency||{type:'daily'};if(f.type==='weekly')return `📆${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][f.day]}`;if(f.type==='custom')return `🔄${f.interval}d`;return '📅'},[habit.frequency]);
    const tagColor={amor:'bg-pink-500/20 text-pink-400',comunicação:'bg-blue-500/20 text-blue-400',espiritual:'bg-purple-500/20 text-purple-400',saúde:'bg-green-500/20 text-green-400',relacionamento:'bg-orange-500/20 text-orange-400'}[habit.tag]||'bg-gray-500/20';
    const today=getToday();if(!active&&dateStr!==today) return null;
    const handleToggle=()=>{if(!active){if(dateStr===today)showToast('Não está ativo hoje',true);return}onToggle(habit.id,dateStr);if(!completed){setFlash(true);setTimeout(()=>setFlash(false),600);vibrate()}};
    return <div className={`bg-card p-1.5 transition-all duration-300 ${flash?'ring-2 ring-green-500':''} ${!active?'opacity-40':''}`}><div className="flex items-center gap-1.5"><span className="text-lg flex-shrink-0">{habit.icon}</span><div className="flex-1 min-w-0"><div className="flex items-center gap-1 flex-wrap"><h3 className="text-primary font-medium text-[11px] truncate">{habit.title}</h3><span className={`text-[9px] px-1.5 py-0.5 rounded-full flex-shrink-0 ${tagColor}`}>{habit.tag}</span></div><div className="flex items-center gap-2 mt-0.5"><span className="text-[9px] text-orange-400">🔥{habit.streak||0}</span><span className="text-[9px] text-secondary">✅{dates.length}</span><span className="text-[9px] text-secondary">{freqText}</span></div></div><div className="flex flex-col items-center gap-0.5 flex-shrink-0"><div className="flex gap-0.5">{!isFirst&&<button onClick={onMoveUp} className="text-[9px] px-1 py-0.5 rounded bg-[var(--bg-button)] text-secondary">▲</button>}{!isLast&&<button onClick={onMoveDown} className="text-[9px] px-1 py-0.5 rounded bg-[var(--bg-button)] text-secondary">▼</button>}</div><button onClick={()=>onEdit(habit)} className="text-secondary text-xs hover:text-green-400">✏️</button><button onClick={()=>onDelete(habit.id)} className="text-secondary text-xs hover:text-red-400">🗑️</button><button onClick={handleToggle} disabled={!active} className={`check-button ${completed?'check-button-completed':'check-button-pending'} ${!active?'opacity-50':''}`}>{completed?'✓':'○'}</button></div></div></div>
});

const TaskCard = memo(({task, onToggle, onEdit, onDelete, onReact, currentUser, names}) => {
    const isCompleted=task.completedBy?.[currentUser]||false;
    const priorityColor=task.priority==='high'?'#ef4444':task.priority==='medium'?'#f59e0b':'#10b981';
    const isOverdue=task.dueDate&&!isCompleted&&new Date(task.dueDate)<new Date(getToday());
    const assignedName=task.assignedTo==='josiel'?names.josiel:task.assignedTo==='zipora'?names.zipora:'Ambos';
    return <div className={`bg-card p-1.5 flex items-center gap-1.5 border-l-[3px] ${isCompleted?'opacity-50':''}`} style={{borderLeftColor:priorityColor}}><button onClick={()=>{if(!isCompleted)vibrate();onToggle(task.id)}} className={`task-check ${isCompleted?'task-check-done':'task-check-todo'}`}>{isCompleted?'✓':''}</button><div className="flex-1 min-w-0"><div className="flex items-center gap-1 flex-wrap"><span className="text-sm">{task.icon}</span><h3 className={`text-primary font-medium text-[10px] truncate ${isCompleted?'line-through':''}`}>{task.title}</h3>{isOverdue&&<span className="text-[8px] bg-red-500/20 text-red-400 px-1 py-0.5 rounded-full">Atrasada</span>}
