    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#0a0a0f;--bg-card:rgba(20,20,35,0.85);--text-primary:#e8e8f0;--text-secondary:#9ca3af;--border-primary:#2d2d44;--bg-button:#2d2d44;--bg-input:#2d2d44;--green-gradient:linear-gradient(135deg,#10b981,#059669);--green-shadow:rgba(16,185,129,0.5)}
        body.light-mode{--bg-primary:#f0f2f5;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#6b6b7a;--border-primary:#e4e6eb;--bg-button:#e8e8f0;--bg-input:#f0f2f5}
        body{background:var(--bg-primary);font-family:'Inter',system-ui;transition:background .3s,color .3s;min-height:100vh}
        .text-primary{color:var(--text-primary)}.text-secondary{color:var(--text-secondary)}.border-primary{border-color:var(--border-primary)}
        .bg-card{background:var(--bg-card);backdrop-filter:blur(12px);border-radius:1rem;border:1px solid var(--border-primary)}
        .bg-input{background:var(--bg-input)}.glass-effect{background:var(--bg-card);backdrop-filter:blur(20px)}
        .check-button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;border:none;transition:all .15s;cursor:pointer}
        .check-button:active{transform:scale(0.9)}.check-button-completed{background:var(--green-gradient);color:white;box-shadow:0 0 14px var(--green-shadow)}.check-button-pending{background:var(--bg-button);color:var(--text-secondary);border:2px solid var(--border-primary)}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,25,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border-primary);padding:6px 4px;z-index:50;display:flex;justify-content:center;gap:4px}
        body.light-mode .bottom-nav{background:rgba(255,255,255,.98)}
        .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:16px;transition:.2s;cursor:pointer;font-size:.6rem;min-width:42px}.bottom-nav-active{background:rgba(16,185,129,.15);color:#10b981;transform:translateY(-2px)}
        .week-calendar{display:flex;gap:3px;overflow-x:auto;padding:4px 0}.week-day{flex-shrink:0;width:36px;text-align:center;padding:4px 2px;border-radius:10px;transition:.2s;cursor:pointer;font-size:.65rem}.week-day:hover{background:rgba(16,185,129,.15)}.week-day-selected{background:var(--green-gradient);color:white}
        .couple-name-highlight{background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
        .switch{position:relative;display:inline-block;width:42px;height:22px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--border-primary);transition:.3s;border-radius:34px}.slider:before{position:absolute;content:"🌙";display:flex;align-items:center;justify-content:center;height:18px;width:18px;left:2px;bottom:2px;background-color:white;transition:.3s;border-radius:50%;font-size:8px}input:checked+.slider{background-color:#10b981}input:checked+.slider:before{transform:translateX(20px);content:"☀️"}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:6px 14px;border-radius:30px;font-size:12px;z-index:1000;animation:fadeInUp .3s}@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .top-notification{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;animation:slideDown .3s ease-out;pointer-events:none}@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .top-notification-content{background:rgba(16,185,129,.95);backdrop-filter:blur(10px);color:white;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:4px;max-width:90vw}
        .loading-spinner{width:32px;height:32px;border:3px solid var(--border-primary);border-top-color:#10b981;border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
        .progress-bar-bg{width:100%;height:5px;background:var(--bg-button);border-radius:8px;overflow:hidden}.progress-bar-fill{height:100%;border-radius:8px;transition:width .5s}
        .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:100px;overflow-y:auto;padding:4px;background:var(--bg-button);border-radius:10px}
        .emoji-btn{font-size:18px;padding:3px;border-radius:8px;background:var(--bg-input);text-align:center;cursor:pointer;transition:.2s}.emoji-btn:hover{transform:scale(1.1);background:#10b981}.emoji-btn.selected{background:#10b981}
        .photo-circle{width:38px;height:38px;border-radius:50%;overflow:hidden;cursor:pointer;position:relative;border:2px solid #10b981;transition:.3s;flex-shrink:0}.photo-circle:hover{border-color:#34d399;box-shadow:0 0 14px rgba(16,185,129,.4);transform:scale(1.05)}
        .photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.3s;font-size:14px;color:white;border-radius:50%}.photo-circle:hover .photo-overlay{opacity:1}
        .mood-btn{transition:all .2s;cursor:pointer;padding:4px;border-radius:8px;font-size:1.2rem}.mood-btn:hover{transform:scale(1.15)}.mood-btn.selected{background:rgba(16,185,129,.2);box-shadow:0 0 10px rgba(16,185,129,.3)}
        .notif-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:white;font-size:.5rem;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
        .notif-panel{position:fixed;top:45px;right:8px;width:260px;max-height:60vh;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-primary);border-radius:14px;z-index:999;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
        .task-check{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;border:none;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;flex-shrink:0}.task-check:active{transform:scale(0.85)}.task-check-done{background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 0 10px rgba(16,185,129,0.4)}.task-check-todo{background:transparent;color:var(--text-secondary);border:2px solid #3d3d55}.task-check-todo:hover{border-color:#10b981;color:#10b981;background:rgba(16,185,129,0.08)}
        @media(max-width:640px){.check-button{width:32px;height:32px;font-size:16px}.photo-circle{width:32px;height:32px}}
    </style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, memo, useRef } = React;

// ===================== UTILITÁRIOS =====================
const getToday = () => new Date().toISOString().split('T')[0];
const formatDate = d => new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const formatDayName = d => d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const getWeekDays = () => {
    const today = new Date(); const days = [];
    for(let i=3;i>=0;i--){const d=new Date();d.setDate(today.getDate()-i);days.push(d)}
    for(let i=1;i<=3;i++){const d=new Date();d.setDate(today.getDate()+i);days.push(d)}
    return days.sort((a,b)=>a-b);
};
const isHabitActiveOnDate = (habit, dateStr) => {
    if(!habit||!dateStr) return false;
    if(!habit.frequency||habit.frequency.type==='daily') return true;
    const date = new Date(dateStr+'T00:00:00');
    if(habit.frequency.type==='weekly') return habit.frequency.day===date.getDay();
    if(habit.frequency.type==='custom'){
        const interval=habit.frequency.interval||2;
        const start=habit.createdAt?new Date(habit.createdAt.split('T')[0]+'T00:00:00'):new Date('2024-01-01T00:00:00');
        return Math.floor((date-start)/86400000)%interval===0;
    }
    return true;
};
const calculateStreak = (dates, frequency) => {
    if(!Array.isArray(dates)||dates.length===0) return 0;
    const sorted=[...dates].sort((a,b)=>b.localeCompare(a));
    const today=getToday();
    if(!frequency||frequency.type==='daily'){
        let streak=0;const check=new Date(today+'T00:00:00');
        const todayOk=sorted.includes(today);
        const yesterday=new Date(check);yesterday.setDate(yesterday.getDate()-1);
        if(!todayOk&&!sorted.includes(yesterday.toISOString().split('T')[0])) return 0;
        let cur=todayOk?new Date(today+'T00:00:00'):yesterday;
        while(sorted.includes(cur.toISOString().split('T')[0])){streak++;cur.setDate(cur.getDate()-1)}
        return streak;
    }
    return 0;
};
const playSound = () => {try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2)}catch(e){}}
const triggerConfetti = () => {if(typeof confetti!=='undefined')confetti({particleCount:60,spread:60,origin:{y:.6},colors:['#10b981','#059669','#34d399']})}
const vibrate = () => {if(navigator.vibrate)navigator.vibrate(30)}
const showToast = (msg, err=false) => {const el=document.createElement('div');el.className='toast';el.style.background=err?'#ef4444':'#10b981';el.innerText=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2000)}
let topTimer=null;
const showTopNotification = (msg, icon='🔔') => {
    const old=document.querySelector('.top-notification');if(old)old.remove();if(topTimer)clearTimeout(topTimer);
    const el=document.createElement('div');el.className='top-notification';
    el.innerHTML=`<div class="top-notification-content"><span>${icon}</span><span>${msg}</span></div>`;
    document.body.appendChild(el);
    topTimer=setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-20px)';setTimeout(()=>el.remove(),300)},2000)
};
const ensureArray = val => Array.isArray(val)?val:(typeof val==='object'&&val!==null?Object.values(val):[]);
const normalizeHabits = habitsObj => {
    const result={josiel:[],zipora:[]};
    if(!habitsObj) return result;
    for(const person of['josiel','zipora']){
        const raw=habitsObj[person];
        const list=Array.isArray(raw)?raw:(typeof raw==='object'&&raw!==null?Object.values(raw):[]);
        result[person]=list.map(h=>({...h,completedDates:ensureArray(h?.completedDates)}));
    }
    return result;
};
const compressImage = file => new Promise(resolve=>{
    const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let w=img.width,h=img.height;const max=300;if(w>max||h>max){if(w>h){h=(h/w)*max;w=max}else{w=(w/h)*max;h=max}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',0.5))};img.src=e.target.result};reader.readAsDataURL(file)
});

const ALL_EMOJIS = ['❤️','💬','🙏','✝️','📖','💌','💑','🧠','🏃','😴','🍽️','💰','🎯','🚶','🤝','💖','🎉','💪','🧘','🥗','⭐','✨','🌟'];
const TASK_EMOJIS = ['📋','🗓️','🛒','💊','🚗','📞','💰','🎯','📝','🏠','❤️','🙏'];

// ===================== COMPONENTES =====================
const HomePage = ({onStart}) => (<div className="min-h-screen flex flex-col items-center justify-center p-6 text-center"><div className="w-24 h-24 bg-gradient-to-r from-green-500 to-emerald-600 rounded-3xl flex items-center justify-center text-5xl mb-6 shadow-xl">💑</div><h1 className="text-4xl font-bold mb-2"><span className="couple-name-highlight">HabitFlow‑Casal</span></h1><p className="text-secondary mb-8">Hábitos e Tarefas para Casais Cristãos</p><button onClick={onStart} className="px-10 py-4 bg-green-500 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition">✨ Começar</button></div>);

const DailyProgress = memo(({habits, date}) => {const ds=date.toISOString().split('T')[0];const active=habits.filter(h=>isHabitActiveOnDate(h,ds));const done=active.filter(h=>h.completedDates?.includes(ds)).length;if(!active.length)return null;const pct=(done/active.length)*100;return <div className="bg-card p-2 mb-2"><div className="flex justify-between mb-1"><span className="text-secondary text-[10px]">Progresso</span><span className="text-primary text-[10px] font-semibold">{done}/{active.length}{pct===100?' 🎉':''}</span></div><div className="progress-bar-bg"><div className="progress-bar-fill" style={{width:`${pct}%`,background:pct===100?'linear-gradient(135deg,#fbbf24,#f59e0b)':'var(--green-gradient)'}}></div></div></div>});
const WeekCalendar = memo(({selectedDate, onSelect, habits}) => {const week=getWeekDays();const today=new Date();return <div className="bg-card p-1.5"><div className="week-calendar">{week.map((day,idx)=>{const ds=day.toISOString().split('T')[0];const sel=selectedDate?.toDateString()===day.toDateString();const active=habits.filter(h=>isHabitActiveOnDate(h,ds));const done=active.filter(h=>h.completedDates?.includes(ds)).length;const total=active.length;let bg='';if(total>0){if(done===total)bg='bg-green-500/20';else if(done>0)bg='bg-yellow-500/20'}return <div key={idx} onClick={()=>onSelect(day)} className={`week-day ${bg} ${sel?'week-day-selected':''}`}><div className="text-xs">{formatDayName(day)}</div><div className={`font-bold ${day.toDateString()===today.toDateString()&&!sel?'text-green-400':''}`}>{day.getDate()}</div>{done>0&&<div className="text-[9px] text-green-400">{done}/{total}</div>}</div>})}</div></div>});
const HabitCard = memo(({habit, onToggle, onEdit, onDelete, onMoveUp, onMoveDown, dateStr, isFirst, isLast}) => {const dates=ensureArray(habit.completedDates);const completed=dates.includes(dateStr);const active=isHabitActiveOnDate(habit,dateStr);const [flash,setFlash]=useState(false);const freqText=useMemo(()=>{const f=habit.frequency||{type:'daily'};if(f.type==='weekly')return `📆${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][f.day]}`;if(f.type==='custom')return `🔄${f.interval}d`;return '📅'},[habit.frequency]);const tagColor={amor:'bg-pink-500/20 text-pink-400',comunicação:'bg-blue-500/20 text-blue-400',espiritual:'bg-purple-500/20 text-purple-400',saúde:'bg-green-500/20 text-green-400',relacionamento:'bg-orange-500/20 text-orange-400'}[habit.tag]||'bg-gray-500/20';const today=getToday();if(!active&&dateStr!==today)return null;const handleToggle=()=>{if(!active){if(dateStr===today)showToast('Não está ativo hoje',true);return}onToggle(habit.id,dateStr);if(!completed){setFlash(true);setTimeout(()=>setFlash(false),600);vibrate()}};return <div className={`bg-card p-1.5 transition-all duration-300 ${flash?'ring-2 ring-green-500':''} ${!active?'opacity-40':''}`}><div className="flex items-center gap-1.5"><span className="text-lg flex-shrink-0">{habit.icon}</span><div className="flex-1 min-w-0"><div className="flex items-center gap-1 flex-wrap"><h3 className="text-primary font-medium text-[11px] truncate">{habit.title}</h3><span className={`text-[9px] px-1.5 py-0.5 rounded-full flex-shrink-0 ${tagColor}`}>{habit.tag}</span></div><div className="flex items-center gap-2 mt-0.5"><span className="text-[9px] text-orange-400">🔥{habit.streak||0}</span><span className="text-[9px] text-secondary">✅{dates.length}</span><span className="text-[9px] text-secondary">{freqText}</span></div></div><div className="flex flex-col items-center gap-0.5 flex-shrink-0"><div className="flex gap-0.5">{!isFirst&&<button onClick={onMoveUp} className="text-[9px] px-1 py-0.5 rounded bg-[var(--bg-button)] text-secondary">▲</button>}{!isLast&&<button onClick={onMoveDown} className="text-[9px] px-1 py-0.5 rounded bg-[var(--bg-button)] text-secondary">▼</button>}</div><button onClick={()=>onEdit(habit)} className="text-secondary text-xs hover:text-green-400">✏️</button><button onClick={()=>onDelete(habit.id)} className="text-secondary text-xs hover:text-red-400">🗑️</button><button onClick={handleToggle} disabled={!active} className={`check-button ${completed?'check-button-completed':'check-button-pending'} ${!active?'opacity-50':''}`}>{completed?'✓':'○'}</button></div></div></div>});
const TaskCard = memo(({task, onToggle, onEdit, onDelete, onReact, currentUser, names}) => {const isCompleted=task.completedBy?.[currentUser]||false;const priorityColor=task.priority==='high'?'#ef4444':task.priority==='medium'?'#f59e0b':'#10b981';const isOverdue=task.dueDate&&!isCompleted&&new Date(task.dueDate)<new Date(getToday());const assignedName=task.assignedTo==='josiel'?names.josiel:task.assignedTo==='zipora'?names.zipora:'Ambos';return <div className={`bg-card p-1.5 flex items-center gap-1.5 border-l-[3px] ${isCompleted?'opacity-50':''}`} style={{borderLeftColor:priorityColor}}><button onClick={()=>{if(!isCompleted)vibrate();onToggle(task.id)}} className={`task-check ${isCompleted?'task-check-done':'task-check-todo'}`}>{isCompleted?'✓':''}</button><div className="flex-1 min-w-0"><div className="flex items-center gap-1 flex-wrap"><span className="text-sm">{task.icon}</span><h3 className={`text-primary font-medium text-[10px] truncate ${isCompleted?'line-through':''}`}>{task.title}</h3>{isOverdue&&<span className="text-[8px] bg-red-500/20 text-red-400 px-1 py-0.5 rounded-full">Atrasada</span>}</div><div className="flex items-center gap-2 mt-0.5"><span className="text-[9px] text-secondary">👤{assignedName}</span>{task.dueDate&&<span className="text-[9px] text-secondary">📅{formatDate(new Date(task.dueDate+'T00:00:00'))}</span>}{isCompleted&&<div className="flex gap-1 ml-auto">{['❤️','🔥','🙏'].map(r=><button key={r} onClick={()=>onReact(task.id,r)} className="text-xs hover:scale-125">{r}</button>)}</div>}</div></div><div className="flex items-center gap-0.5"><button onClick={()=>onEdit(task)} className="text-secondary text-xs hover:text-green-400">✏️</button><button onClick={()=>onDelete(task.id)} className="text-secondary text-xs hover:text-red-400">🗑️</button></div></div>});
const TasksView = memo(({tasks, onToggle, onEdit, onDelete, onReact, onAdd, currentUser, names}) => {const filtered=useMemo(()=>tasks.filter(t=>t.assignedTo===currentUser||t.assignedTo==='both'),[tasks,currentUser]);const sorted=[...filtered].sort((a,b)=>(a.completedBy?.[currentUser]?1:0)-(b.completedBy?.[currentUser]?1:0));return <div className="space-y-2"><div className="flex justify-between items-center"><h2 className="text-base font-semibold text-primary">📋 Tarefas de {names[currentUser]}</h2><button onClick={onAdd} className="bg-gradient-to-r from-blue-500 to-cyan-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-semibold">+ Nova</button></div>{sorted.length===0?<div className="text-center py-10 bg-card"><div className="text-3xl mb-2">📋</div><p className="text-secondary text-xs">Nenhuma tarefa</p></div>:<div className="space-y-1">{sorted.map(t=><TaskCard key={t.id} task={t} onToggle={onToggle} onEdit={onEdit} onDelete={onDelete} onReact={onReact} currentUser={currentUser} names={names}/>)}</div>}</div>});
const NotificationPanel = memo(({notifications, onMarkRead, onClose}) => {const todayNotifs=notifications.filter(n=>{const ts=new Date();ts.setHours(0,0,0,0);return new Date(n.timestamp)>=ts});const unread=todayNotifs.filter(n=>!n.read).length;return <div className="notif-panel p-3"><div className="flex justify-between items-center mb-2"><h3 className="text-primary font-semibold text-sm">🔔 Hoje {unread>0&&`(${unread})`}</h3><button onClick={onClose} className="text-secondary hover:text-red-400">✕</button></div>{todayNotifs.length===0?<p className="text-secondary text-xs text-center py-4">Nenhuma notificação hoje</p>:todayNotifs.slice(0,15).map((n,i)=><div key={i} onClick={()=>onMarkRead(n.id)} className={`flex items-start gap-2 py-1.5 border-b border-primary/20 last:border-0 cursor-pointer ${!n.read?'bg-green-500/5 -mx-2 px-2 rounded':''}`}><span className="text-base flex-shrink-0">{n.icon||'🔔'}</span><div className="flex-1 min-w-0"><p className="text-primary text-[10px]">{n.message}</p><p className="text-secondary text-[9px] mt-0.5">{new Date(n.timestamp).toLocaleTimeString()}</p></div>{!n.read&&<div className="w-2 h-2 rounded-full bg-green-500 flex-shrink-0 mt-0.5"></div>}</div>)}</div>});
const HabitFormModal = memo(({isOpen,onClose,onSave,initial,categories}) => {const [title,setTitle]=useState('');const [icon,setIcon]=useState('❤️');const [tag,setTag]=useState('amor');const [freqType,setFreqType]=useState('daily');const [weeklyDay,setWeeklyDay]=useState(0);const [customInterval,setCustomInterval]=useState(2);useEffect(()=>{if(isOpen){if(initial){setTitle(initial.title||'');setIcon(initial.icon||'❤️');setTag(initial.tag||'amor');const f=initial.frequency||{type:'daily'};setFreqType(f.type||'daily');setWeeklyDay(f.day||0);setCustomInterval(f.interval||2)}else{setTitle('');setIcon('❤️');setTag('amor');setFreqType('daily');setWeeklyDay(0);setCustomInterval(2)}}},[isOpen,initial]);if(!isOpen)return null;return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[300] p-4" onClick={onClose}><div className="glass-effect p-4 max-w-sm w-full" onClick={e=>e.stopPropagation()}><h3 className="text-lg font-bold mb-3">{initial?'Editar':'Novo'} Hábito</h3><form onSubmit={e=>{e.preventDefault();if(!title.trim()){showToast('Nome obrigatório',true);return}onSave({...(initial||{}),title:title.trim(),icon,tag,frequency:freqType==='weekly'?{type:'weekly',day:weeklyDay}:freqType==='custom'?{type:'custom',interval:customInterval}:{type:'daily'}});onClose()}} className="space-y-3"><div className="emoji-grid">{ALL_EMOJIS.map(e=><div key={e} onClick={()=>setIcon(e)} className={`emoji-btn ${icon===e?'selected':''}`}>{e}</div>)}</div><input value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary border border-primary text-sm" placeholder="Nome" required/><select value={tag} onChange={e=>setTag(e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary text-sm">{categories.map(c=><option key={c} value={c}>{c}</option>)}</select><div className="flex gap-2">{['daily','weekly','custom'].map(t=><button key={t} type="button" onClick={()=>setFreqType(t)} className={`px-2 py-1 rounded-lg text-xs ${freqType===t?'bg-green-500 text-white':'bg-input text-secondary'}`}>{t==='daily'?'📅':t==='weekly'?'📆':'🔄'}</button>)}</div>{freqType==='weekly'&&<select value={weeklyDay} onChange={e=>setWeeklyDay(+e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary text-sm">{['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=><option key={i} value={i}>{d}</option>)}</select>}{freqType==='custom'&&<div className="flex items-center gap-2"><input type="number" min="1" value={customInterval} onChange={e=>setCustomInterval(Math.max(1,+e.target.value||2))} className="p-1.5 rounded-lg bg-input text-primary w-14 text-sm"/> dias</div>}<div className="flex gap-2"><button type="button" onClick={onClose} className="flex-1 py-1.5 rounded-lg bg-input text-secondary text-sm">Cancelar</button><button type="submit" className="flex-1 py-1.5 rounded-lg bg-green-500 text-white text-sm">{initial?'Salvar':'Criar'}</button></div></form></div></div>});
const TaskFormModal = memo(({isOpen,onClose,onSave,initial,names,activePerson}) => {const [title,setTitle]=useState('');const [icon,setIcon]=useState('📋');const [priority,setPriority]=useState('medium');const [assignedTo,setAssignedTo]=useState(activePerson);const [dueDate,setDueDate]=useState('');useEffect(()=>{if(isOpen){if(initial){setTitle(initial.title||'');setIcon(initial.icon||'📋');setPriority(initial.priority||'medium');setAssignedTo(initial.assignedTo||activePerson);setDueDate(initial.dueDate||'')}else{setTitle('');setIcon('📋');setPriority('medium');setAssignedTo(activePerson);setDueDate('')}}},[isOpen,initial,activePerson]);if(!isOpen)return null;return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[300] p-4" onClick={onClose}><div className="glass-effect p-3 max-w-xs w-full" onClick={e=>e.stopPropagation()}><h3 className="text-base font-bold mb-2">{initial?'Editar':'Nova'} Tarefa</h3><form onSubmit={e=>{e.preventDefault();if(!title.trim()){showToast('Título obrigatório',true);return};onSave({...(initial||{}),title:title.trim(),icon,priority,assignedTo,dueDate:dueDate||null});onClose()}} className="space-y-2"><div className="emoji-grid" style={{maxHeight:'80px'}}>{TASK_EMOJIS.map(e=><div key={e} onClick={()=>setIcon(e)} className={`emoji-btn ${icon===e?'selected':''}`}>{e}</div>)}</div><input value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary border border-primary text-sm" placeholder="Título" required/><div className="flex gap-1">{['high','medium','low'].map(p=><button key={p} type="button" onClick={()=>setPriority(p)} className={`px-2 py-1 rounded-lg text-[10px] font-medium ${priority===p?(p==='high'?'bg-red-500 text-white':p==='medium'?'bg-yellow-500 text-black':'bg-green-500 text-white'):'bg-input text-secondary'}`}>{p==='high'?'🔴':p==='medium'?'🟡':'🟢'}</button>)}</div><select value={assignedTo} onChange={e=>setAssignedTo(e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary text-sm"><option value="josiel">{names.josiel}</option><option value="zipora">{names.zipora}</option><option value="both">Ambos</option></select><input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} className="w-full p-1.5 rounded-lg bg-input text-primary text-sm"/><div className="flex gap-2"><button type="button" onClick={onClose} className="flex-1 py-1.5 rounded-lg bg-input text-secondary text-sm">Cancelar</button><button type="submit" className="flex-1 py-1.5 rounded-lg bg-green-500 text-white text-sm">{initial?'Salvar':'Criar'}</button></div></form></div></div>});
const LoginScreen = ({onBack}) => {const [email,setEmail]=useState('');const [pass,setPass]=useState('');const [isReg,setIsReg]=useState(false);const [loading,setLoading]=useState(false);const [error,setError]=useState('');const submit=async e=>{e.preventDefault();setLoading(true);setError('');try{isReg?await window.firebaseCreateUser(window.firebaseAuth,email,pass):await window.firebaseSignIn(window.firebaseAuth,email,pass);showToast(isReg?'Conta criada!':'Bem-vindo!')}catch(err){let m=err.message;if(m.includes('invalid-email'))m='Email inválido';setError(m);showToast(m,true)}setLoading(false)};return <div className="min-h-screen flex items-center justify-center p-4"><div className="glass-effect p-6 max-w-md w-full"><div className="text-center mb-6"><div className="text-6xl mb-3">💑</div><h1 className="text-3xl font-bold couple-name-highlight">HabitFlow‑Casal</h1></div><form onSubmit={submit} className="space-y-3"><input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3 rounded-xl bg-input text-primary border border-primary" required/><input type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 rounded-xl bg-input text-primary border border-primary" required/>{error&&<p className="text-red-400 text-sm">{error}</p>}<button type="submit" disabled={loading} className="w-full py-3 bg-green-500 text-white rounded-xl font-semibold">{loading?<div className="loading-spinner mx-auto"></div>:(isReg?'Criar Conta ✨':'Entrar 🚀')}</button><p className="text-center text-secondary text-sm">{isReg?'Já tem conta?':'Não tem conta?'} <button type="button" onClick={()=>setIsReg(!isReg)} className="text-green-400">{isReg?'Login':'Cadastre-se'}</button></p></form>{onBack&&<button onClick={onBack} className="w-full mt-4 text-secondary text-sm">← Voltar</button>}</div></div>};

// ===================== APP PRINCIPAL =====================
const App = () => {
    const [user,setUser]=useState(null);const [loading,setLoading]=useState(true);const [showHome,setShowHome]=useState(true);
    const [activePerson,setActivePerson]=useState('josiel');const [nav,setNav]=useState('habits');
    const [theme,setTheme]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const [names,setNames]=useState({josiel:'Josiel',zipora:'Zipora'});
    const [habitsData,setHabitsData]=useState({josiel:[],zipora:[]});
    const [tasksData,setTasksData]=useState([]);
    const [selectedDate,setSelectedDate]=useState(new Date());
    const [modalOpen,setModalOpen]=useState(false);const [editingHabit,setEditingHabit]=useState(null);
    const [taskModalOpen,setTaskModalOpen]=useState(false);const [editingTask,setEditingTask]=useState(null);
    const [couplePhoto,setCouplePhoto]=useState(null);
    const [coupleXP,setCoupleXP]=useState(0);
    const [mood,setMood]=useState(null);
    const [notifications,setNotifications]=useState([]);
    const [showNotif,setShowNotif]=useState(false);
    const [categories]=useState(['amor','comunicação','espiritual','saúde','relacionamento']);
    const localUpdateFlag=useRef(false);

    useEffect(()=>{document.body.className=theme==='light'?'light-mode':''},[theme]);

    useEffect(()=>{
        const unsubAuth=window.firebaseOnAuthStateChanged(window.firebaseAuth,authUser=>{
            if(authUser){setUser(authUser);setShowHome(false);
                const userRef=window.firebaseRef(window.firebaseDatabase,`users/${authUser.uid}`);
                const unsubData=window.firebaseOnValue(userRef,snap=>{
                    if(localUpdateFlag.current){localUpdateFlag.current=false;return}
                    if(snap.exists()){const d=snap.val();setNames(d.names||{josiel:'Josiel',zipora:'Zipora'});setHabitsData(normalizeHabits(d.habits));setTheme(d.theme||theme);setCouplePhoto(d.couplePhoto||null);setCoupleXP(d.coupleXP||0);setMood(d.mood||null);if(d.tasks)setTasksData(Array.isArray(d.tasks)?d.tasks:Object.values(d.tasks||{}));setNotifications(d.notifications||[])}
                    else{window.firebaseSet(userRef,{names:{josiel:'Josiel',zipora:'Zipora'},habits:{josiel:[],zipora:[]},tasks:[],theme:'dark',coupleXP:0,couplePhoto:null,mood:null,notifications:[]})}
                });
                setLoading(false);return ()=>unsubData();
            }else{setUser(null);setLoading(false)}
        });return ()=>unsubAuth();
    },[]);

    useEffect(()=>{setSelectedDate(new Date())},[]);

    const updateFB=useCallback(data=>{if(!user)return;localUpdateFlag.current=true;window.firebaseUpdate(window.firebaseRef(window.firebaseDatabase,`users/${user.uid}`),data).catch(err=>console.error('FB err:',err))},[user]);

    const addNotification = (icon,message,refId) => {
        setNotifications(prev => {
            const notif = {id:`notif_${Date.now()}`,icon,message,timestamp:Date.now(),read:false,refId};
            const nd = [notif,...prev].slice(0,50);
            updateFB({notifications:nd});
            showTopNotification(message,icon);
            return nd;
        });
    };
    const removeNotificationByRef = (refId) => {if(!refId)return;setNotifications(prev=>{const nd=prev.filter(n=>n.refId!==refId);updateFB({notifications:nd});return nd;});};
    const markNotifRead = (id) => {setNotifications(prev=>{const nd=prev.map(n=>n.id===id?{...n,read:true}:n);updateFB({notifications:nd});return nd;});};

    const handlePhoto=useCallback(async e=>{const f=e.target.files[0];if(!f)return;try{const c=await compressImage(f);setCouplePhoto(c);updateFB({couplePhoto:c});showToast('Foto atualizada!')}catch{showToast('Erro',true)}},[updateFB]);
    const handleMood=useCallback(m=>{setMood(m);updateFB({mood:m});addNotification('😊',`${names[activePerson]} está se sentindo ${m}`,`mood_${activePerson}_${getToday()}`)},[updateFB,activePerson,names]);

    const moveHabit=useCallback((id,dir)=>{const list=[...habitsData[activePerson]].sort((a,b)=>(a.order||0)-(b.order||0));const idx=list.findIndex(h=>h.id===id);if(idx===-1)return;if(dir==='up'&&idx>0)[list[idx],list[idx-1]]=[list[idx-1],list[idx]];else if(dir==='down'&&idx<list.length-1)[list[idx],list[idx+1]]=[list[idx+1],list[idx]];const reordered=list.map((h,i)=>({...h,order:i}));const nd={...habitsData,[activePerson]:reordered};setHabitsData(nd);updateFB({habits:nd})},[activePerson,habitsData,updateFB]);
    const addHabit=useCallback(h=>{const nh={...h,id:`${activePerson}_${Date.now()}`,completedDates:[],streak:0,order:habitsData[activePerson].length,createdAt:new Date().toISOString()};const nd={...habitsData,[activePerson]:[...habitsData[activePerson],nh]};setHabitsData(nd);updateFB({habits:nd});showToast(`"${h.title}" criado!`);addNotification('🔥',`${names[activePerson]} criou "${h.title}"`,`habit_create_${activePerson}_${nh.id}`)},[activePerson,habitsData,updateFB,names]);
    const editHabit=useCallback(u=>{const nd={...habitsData,[activePerson]:habitsData[activePerson].map(h=>h.id===u.id?{...h,...u}:h)};setHabitsData(nd);updateFB({habits:nd});showToast('Hábito atualizado!')},[activePerson,habitsData,updateFB]);
    const deleteHabit=useCallback(id=>{if(!confirm('Deletar?'))return;const nd={...habitsData,[activePerson]:habitsData[activePerson].filter(h=>h.id!==id)};setHabitsData(nd);updateFB({habits:nd})},[activePerson,habitsData,updateFB]);

    const toggleHabit=useCallback((hid,ds)=>{setHabitsData(prev=>{const ph=prev[activePerson]||[];const nl=ph.map(h=>{if(h.id!==hid)return h;const curDates=ensureArray(h.completedDates);const already=curDates.includes(ds);const newDates=already?curDates.filter(d=>d!==ds):[...curDates,ds];const streak=calculateStreak(newDates,h.frequency||{type:'daily'});return{...h,completedDates:newDates,streak}});const toggled=nl.find(h=>h.id===hid);const wasCompleted=ensureArray(ph.find(h=>h.id===hid)?.completedDates).includes(ds);const isNowCompleted=toggled?.completedDates?.includes(ds);const refId=`habit_${activePerson}_${hid}_${ds}`;
        if(isNowCompleted&&!wasCompleted){playSound();triggerConfetti();vibrate();showTopNotification(`✓ ${toggled.title} concluído!`,'🎉');setCoupleXP(prevXP=>{const newXP=prevXP+10+(toggled.tag==='espiritual'?5:0);updateFB({coupleXP:newXP});return newXP});addNotification(toggled.icon,`${names[activePerson]} concluiu "${toggled.title}"`,refId)}
        else if(!isNowCompleted&&wasCompleted){removeNotificationByRef(refId)}
        const nd={...prev,[activePerson]:nl};updateFB({habits:nd});return nd})},[activePerson,updateFB,names]);

    const addTask=useCallback(t=>{const nt={...t,id:`task_${Date.now()}`,completedBy:{},createdAt:Date.now()};const nd=[...tasksData,nt];setTasksData(nd);updateFB({tasks:nd});showToast(`Tarefa "${t.title}" criada!`);addNotification('📋',`${names[activePerson]} criou "${t.title}"`,`task_create_${activePerson}_${nt.id}`)},[tasksData,updateFB,names]);
    const editTask=useCallback(t=>{const nd=tasksData.map(x=>x.id===t.id?{...x,...t}:x);setTasksData(nd);updateFB({tasks:nd})},[tasksData,updateFB]);
    const deleteTask=useCallback(id=>{if(!confirm('Deletar?'))return;const nd=tasksData.filter(t=>t.id!==id);setTasksData(nd);updateFB({tasks:nd})},[tasksData,updateFB]);
    const toggleTask=useCallback(tid=>{const nd=tasksData.map(t=>{if(t.id!==tid)return t;const cb={...(t.completedBy||{})};const wasCompleted=!!cb[activePerson];if(wasCompleted){delete cb[activePerson];removeNotificationByRef(`task_${activePerson}_${tid}`)}else{cb[activePerson]=true;playSound();vibrate();addNotification(t.icon,`${names[activePerson]} concluiu "${t.title}"`,`task_${activePerson}_${tid}`)}return{...t,completedBy:cb}});setTasksData(nd);updateFB({tasks:nd})},[tasksData,activePerson,names,updateFB]);
    const reactTask=useCallback((tid,reaction)=>{addNotification(reaction,`${names[activePerson]} reagiu com ${reaction}`,`react_${activePerson}_${tid}_${Date.now()}`)},[names,activePerson]);

    const toggleTheme=useCallback(()=>{const t=theme==='dark'?'light':'dark';setTheme(t);document.body.className=t==='light'?'light-mode':'';updateFB({theme:t})},[theme,updateFB]);
    const logout=useCallback(async()=>{await window.firebaseSignOut(window.firebaseAuth);setUser(null);setShowHome(true)},[]);

    if(loading)return<div className="min-h-screen flex items-center justify-center"><div className="loading-spinner"></div></div>;
    if(!user&&showHome)return<HomePage onStart={()=>setShowHome(false)}/>;
    if(!user&&!showHome)return<LoginScreen onBack={()=>setShowHome(true)}/>;

    const currentHabits=habitsData[activePerson]||[];
    const dateStr=selectedDate.toISOString().split('T')[0];
    const gradient=activePerson==='josiel'?'from-blue-500 to-cyan-500':'from-pink-500 to-rose-500';
    const sortedHabits=[...currentHabits].sort((a,b)=>(a.order||0)-(b.order||0));
    const level=Math.floor((coupleXP||0)/100)+1;
    const todayDone=Object.values(habitsData).flat().filter(h=>h.completedDates?.includes(getToday())).length;
    const totalActive=Object.values(habitsData).flat().filter(h=>isHabitActiveOnDate(h,getToday())).length;
    const energyPct=totalActive>0?Math.round((todayDone/totalActive)*100):0;
    const todayNotes=notifications.filter(n=>{const ts=new Date();ts.setHours(0,0,0,0);return new Date(n.timestamp)>=ts});
    const unreadNotif=todayNotes.filter(n=>!n.read).length;

    return (<div className="min-h-screen bg-[var(--bg-primary)] pb-20">
        <header className="border-b border-primary bg-[var(--bg-primary)]/80 backdrop-blur-xl sticky top-0 z-40 p-2">
            <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
                <div className="flex items-center gap-2">
                    <div className="photo-circle" onClick={()=>document.getElementById('photoInput').click()}>{couplePhoto?<img src={couplePhoto} className="w-full h-full object-cover" alt="Foto"/>:<div className="w-full h-full bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-lg">💑</div>}<div className="photo-overlay">📷</div></div>
                    <input type="file" id="photoInput" accept="image/*" className="hidden" onChange={handlePhoto}/>
                    <div><h1 className="text-base font-bold couple-name-highlight">HabitFlow‑Casal</h1><p className="text-[9px] text-secondary">Nv.{level}</p></div>
                </div>
                <div className="flex gap-1 items-center">
                    <div className="relative mr-1"><button onClick={()=>setShowNotif(!showNotif)} className="text-lg relative">🔔{unreadNotif>0&&<span className="notif-badge">{unreadNotif}</span>}</button>{showNotif&&<><div className="fixed inset-0 z-[998]" onClick={()=>setShowNotif(false)}></div><NotificationPanel notifications={notifications} onMarkRead={markNotifRead} onClose={()=>setShowNotif(false)}/></>}</div>
                    <button onClick={()=>setActivePerson('josiel')} className={`px-2 py-1 rounded-lg text-[10px] font-semibold transition ${activePerson==='josiel'?'bg-green-500 text-white':'bg-input text-secondary'}`}>💙{names.josiel}</button>
                    <button onClick={()=>setActivePerson('zipora')} className={`px-2 py-1 rounded-lg text-[10px] font-semibold transition ${activePerson==='zipora'?'bg-green-500 text-white':'bg-input text-secondary'}`}>💖{names.zipora}</button>
                    <button onClick={logout} className="px-2 py-1 rounded-lg bg-red-500/20 text-red-400 text-[10px]">🚪</button>
                </div>
            </div>
            <div className="mb-1"><div className="flex justify-between text-[9px] mb-0.5"><span className="text-secondary">🔋Energia</span><span className="text-primary font-semibold">{energyPct}%</span></div><div className="progress-bar-bg"><div className="progress-bar-fill" style={{width:`${energyPct}%`,background:energyPct>=100?'linear-gradient(135deg,#ec4899,#8b5cf6)':energyPct>=70?'linear-gradient(135deg,#fbbf24,#f59e0b)':'var(--green-gradient)'}}></div></div></div>
            {energyPct>=100&&<p className="text-[9px] text-center text-fuchsia-400 mb-1">⚡Energia máxima!</p>}
            <WeekCalendar selectedDate={selectedDate} onSelect={setSelectedDate} habits={currentHabits}/>
        </header>
        <main className="p-2 max-w-2xl mx-auto">
            {nav==='habits'&&<><div className="flex justify-between items-center mb-2"><h2 className="text-base font-semibold">{names[activePerson]}</h2><button onClick={()=>{setEditingHabit(null);setModalOpen(true)}} className={`bg-gradient-to-r ${gradient} text-white px-2.5 py-1 rounded-lg text-[11px] font-semibold`}>+ Novo</button></div><DailyProgress habits={currentHabits} date={selectedDate}/><div className="bg-card p-2 mb-2"><p className="text-secondary text-[10px] mb-1">😊 Como você está?</p><div className="flex gap-2">{['😊','😐','😔','🙏','🔥'].map(m=><div key={m} onClick={()=>handleMood(m)} className={`mood-btn ${mood===m?'selected':''}`}>{m}</div>)}</div></div><div className="space-y-1">{sortedHabits.map((h,idx)=><HabitCard key={h.id} habit={h} onToggle={toggleHabit} onEdit={h=>{setEditingHabit(h);setModalOpen(true)}} onDelete={deleteHabit} onMoveUp={()=>moveHabit(h.id,'up')} onMoveDown={()=>moveHabit(h.id,'down')} dateStr={dateStr} isFirst={idx===0} isLast={idx===sortedHabits.length-1}/>)}{sortedHabits.length===0&&<div className="text-center py-10 bg-card"><div className="text-3xl mb-2">🌱</div><p className="text-secondary text-xs">Nenhum hábito ainda</p></div>}</div></>}
            {nav==='tasks'&&<TasksView tasks={tasksData} onToggle={toggleTask} onEdit={t=>{setEditingTask(t);setTaskModalOpen(true)}} onDelete={deleteTask} onReact={reactTask} onAdd={()=>{setEditingTask(null);setTaskModalOpen(true)}} currentUser={activePerson} names={names}/>}
            {nav==='couple'&&<div className="space-y-3"><h2 className="text-base font-semibold text-primary">❤️ Modo Casal</h2><div className="bg-card p-3 text-center"><div className="text-3xl mb-2">💑</div><p className="text-primary font-semibold text-sm">{names.josiel} & {names.zipora}</p><p className="text-secondary text-xs">Nv.{level}</p><div className="mt-2"><div className="flex justify-between text-[10px] mb-1"><span>Progresso</span><span>{coupleXP} XP</span></div><div className="progress-bar-bg"><div className="progress-bar-fill" style={{width:`${(coupleXP%100)}%`,background:'linear-gradient(135deg,#fbbf24,#f59e0b)'}}></div></div></div></div></div>}
            {nav==='settings'&&<div className="space-y-3 pb-20"><div className="bg-card p-3"><h3 className="text-primary font-semibold text-sm mb-2">📸 Foto</h3><div className="flex justify-center"><div className="photo-circle" style={{width:'70px',height:'70px'}} onClick={()=>document.getElementById('photoInput2').click()}>{couplePhoto?<img src={couplePhoto} className="w-full h-full object-cover" alt="Foto"/>:<div className="w-full h-full bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-2xl">💑</div>}</div><input type="file" id="photoInput2" accept="image/*" className="hidden" onChange={handlePhoto}/></div></div><div className="bg-card p-3"><h3 className="text-primary font-semibold text-sm mb-2">👤 Nomes</h3>{['josiel','zipora'].map(p=><div key={p} className="flex gap-2 mb-2"><input value={names[p]} onChange={e=>setNames(n=>({...n,[p]:e.target.value}))} className="flex-1 p-1.5 rounded-lg bg-input text-primary text-sm"/><button onClick={()=>updateFB({names})} className="px-2 py-1.5 bg-green-500 text-white text-xs rounded-lg">Salvar</button></div>)}</div><div className="bg-card p-3"><h3 className="text-primary font-semibold text-sm mb-2">🎨 Tema</h3><div className="flex justify-between"><span className="text-sm">{theme==='dark'?'🌙 Escuro':'☀️ Claro'}</span><label className="switch"><input type="checkbox" checked={theme==='light'} onChange={toggleTheme}/><span className="slider"></span></label></div></div></div>}
        </main>
        <div className="bottom-nav">{[{id:'habits',icon:'🔥',label:'Hábitos'},{id:'tasks',icon:'✅',label:'Tarefas'},{id:'couple',icon:'❤️',label:'Casal'},{id:'settings',icon:'⚙️',label:'Ajustes'}].map(item=>(<div key={item.id} onClick={()=>setNav(item.id)} className={`bottom-nav-item ${nav===item.id?'bottom-nav-active':'text-secondary'}`}><span className="text-sm">{item.icon}</span><span>{item.label}</span></div>))}</div>
        <HabitFormModal isOpen={modalOpen} onClose={()=>{setModalOpen(false);setEditingHabit(null)}} onSave={editingHabit?editHabit:addHabit} initial={editingHabit} categories={categories}/>
        <TaskFormModal isOpen={taskModalOpen} onClose={()=>{setTaskModalOpen(false);setEditingTask(null)}} onSave={editingTask?editTask:addTask} initial={editingTask} names={names} activePerson={activePerson}/>
    </div>);
};

// Renderização compatível com Vercel
const rootElement = document.getElementById('root');
if (rootElement) {
    if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootElement).render(<App />);
    } else {
        ReactDOM.render(<App />, rootElement);
    }
}
</script>
</body>
</html>
