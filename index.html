<body>
    <div id="root"></div>
    <script type="text/babel">
        // ---------- UTILS ----------
        const getToday = () => new Date().toISOString().split('T')[0];
        const formatDate = (d) => new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
        const formatDayName = (d) => d.toLocaleDateString('pt-BR', { weekday:'short' }).replace('.','');
        const getWeekDays = () => {
            const today = new Date();
            const days = [];
            for(let i=3;i>=0;i--) { let d=new Date(); d.setDate(today.getDate()-i); days.push(d); }
            for(let i=1;i<=3;i++) { let d=new Date(); d.setDate(today.getDate()+i); days.push(d); }
            return days.sort((a,b)=>a-b);
        };
        const calculateStreak = (dates) => {
            if(!dates||!dates.length) return 0;
            const sorted = [...dates].sort().reverse();
            let streak=1, cur=new Date(sorted[0]);
            for(let i=1;i<sorted.length;i++) {
                let prev=new Date(sorted[i]);
                let diff=Math.floor((cur-prev)/(86400000));
                if(diff===1) { streak++; cur=prev; } else break;
            }
            return streak;
        };
        const showToast = (msg) => {
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerText = msg;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(), 2000);
        };
        
        // ---------- DADOS PADRÃO ----------
        const defaultHabits = [
            { title:'Elogiar o parceiro', description:'Diga algo positivo', icon:'❤️', tag:'amor', frequency:{type:'daily'}, points:10 },
            { title:'Conversar sem celular', description:'Momento sem distrações', icon:'💬', tag:'comunicação', frequency:{type:'daily'}, points:15 },
            { title:'Gratidão diária', description:'Agradecer a Deus', icon:'🙏', tag:'espiritual', frequency:{type:'daily'}, points:10 },
            { title:'Oração juntos', description:'Orar em casal', icon:'✝️', tag:'espiritual', frequency:{type:'daily'}, points:15 },
            { title:'Ler a Bíblia', description:'Devocional', icon:'📖', tag:'espiritual', frequency:{type:'daily'}, points:15 },
        ];
        
        const allEmojis = ['❤️','💬','🙏','✝️','📖','💌','💑','🧠','🏃','😴','🍽️','💰','🎯','🚶','🤝','💖','🎉','💪','🧘','🥗','⭐','✨','🌟','🌹','🕊️','⛪'];
        
        // ---------- COMPONENTES ----------
        const WeekCalendar = ({ selectedDate, onSelect, habits }) => {
            const week = getWeekDays();
            const today = new Date();
            const hasCompletion = (date) => habits.some(h => h.completedDates?.includes(date.toISOString().split('T')[0]));
            return (
                <div className="bg-card border border-primary rounded-2xl p-2">
                    <div className="week-calendar">
                        {week.map((day,idx)=>{
                            const isSel = selectedDate && day.toDateString() === new Date(selectedDate).toDateString();
                            const isToday = day.toDateString() === today.toDateString();
                            return (
                                <div key={idx} onClick={()=>onSelect(day)} className={`week-day ${isSel?'week-day-selected':''} ${hasCompletion(day)?'week-day-completed':''}`}>
                                    <div className="text-xs font-medium">{formatDayName(day)}</div>
                                    <div className={`text-lg font-bold ${isToday && !isSel ? 'text-green-400' : 'text-primary'}`}>{day.getDate()}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        const HabitCard = ({ habit, onToggle, onEdit, onDelete, selectedDate, index }) => {
            const dateCheck = selectedDate ? selectedDate.toISOString().split('T')[0] : getToday();
            const completed = habit.completedDates?.includes(dateCheck) || false;
            const [menu, setMenu] = React.useState(false);
            const [pos, setPos] = React.useState({x:0,y:0});
            const freqText = (()=>{
                if(!habit.frequency) return '📅 Todo dia';
                if(habit.frequency.type==='daily') return '📅 Todo dia';
                if(habit.frequency.type==='weekly') return `📆 ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][habit.frequency.day]}`;
                if(habit.frequency.type==='custom') return `🔄 A cada ${habit.frequency.interval} dias`;
                return '📅 Todo dia';
            })();
            const tagColor = { amor:'bg-pink-500/20 text-pink-400', comunicação:'bg-blue-500/20 text-blue-400', espiritual:'bg-purple-500/20 text-purple-400', saúde:'bg-green-500/20 text-green-400', relacionamento:'bg-orange-500/20 text-orange-400' }[habit.tag] || 'bg-gray-500/20 text-gray-400';
            return (
                <div className="bg-card border border-primary rounded-2xl p-3 animate-fade-in-up transition-all hover:border-green-500/40" style={{animationDelay:`${index*0.05}s`}}>
                    <div className="flex items-start gap-2">
                        <div className="flex-1">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-2xl">{habit.icon}</span>
                                <h3 className="text-primary font-semibold text-sm">{habit.title}</h3>
                                <span className={`text-xs px-2 py-0.5 rounded-full ${tagColor}`}>{habit.tag}</span>
                            </div>
                            <div className="flex items-center gap-3 mt-1">
                                <span className="text-xs text-orange-400">🔥 {habit.streak||0}</span>
                                <span className="text-secondary text-xs">✅ {habit.completedDates?.length||0}</span>
                                <span className="text-secondary text-xs">{freqText}</span>
                            </div>
                            {habit.description && <p className="text-secondary text-xs mt-1">{habit.description}</p>}
                        </div>
                        <div className="flex flex-col items-center gap-1">
                            <button onClick={(e)=>{ e.stopPropagation(); setPos({x:e.clientX,y:e.clientY}); setMenu(true); }} className="text-secondary text-xl">⋮</button>
                            <button onClick={()=>onToggle(habit.id, dateCheck)} className={`check-button ${completed?'check-button-completed':'check-button-pending'}`} style={{width:42,height:42,fontSize:20}}>{completed?'✓':'○'}</button>
                        </div>
                    </div>
                    {menu && (
                        <div className="context-menu" style={{top:pos.y-60, left:pos.x-130}}>
                            <div className="context-menu-item" onClick={()=>{ onEdit(habit); setMenu(false); }}>✏️ Editar</div>
                            <div className="context-menu-item delete" onClick={()=>{ if(confirm(`Deletar "${habit.title}"?`)) onDelete(habit.id); setMenu(false); }}>🗑️ Deletar</div>
                        </div>
                    )}
                </div>
            );
        };
        
        // ---------- TELA DE LOGIN ----------
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = React.useState('');
            const [pass, setPass] = React.useState('');
            const [isReg, setIsReg] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            const handleSubmit = async(e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    if(isReg) await window.firebaseCreateUser(window.firebaseAuth, email, pass);
                    else await window.firebaseSignIn(window.firebaseAuth, email, pass);
                    showToast(isReg ? 'Conta criada! 🎉' : 'Bem-vindo! 👋');
                    onLogin();
                } catch(err) {
                    let msg = err.message;
                    if(msg.includes('invalid-email')) msg='Email inválido';
                    else if(msg.includes('user-not-found')) msg='Usuário não encontrado';
                    else if(msg.includes('wrong-password')) msg='Senha incorreta';
                    else if(msg.includes('email-already-in-use')) msg='Email já cadastrado';
                    setError(msg);
                    showToast(msg,'error');
                }
                setLoading(false);
            };
            return (
                <div className="min-h-screen bg-gradient-to-br from-[#0a0a0f] to-[#0f0f1a] flex items-center justify-center p-4">
                    <div className="glass-effect rounded-3xl p-6 max-w-md w-full border border-primary animate-fade-in-up">
                        <div className="text-center mb-5">
                            <div className="text-6xl mb-2">💑</div>
                            <h1 className="text-3xl font-bold couple-name-highlight">HabitFlow</h1>
                            <p className="text-secondary text-sm">Fortaleça seu relacionamento</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input type="email" placeholder="seu@email.com" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:ring-2 focus:ring-green-500" required />
                            <input type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 rounded-xl bg-[#2d2d44] text-primary placeholder:text-secondary focus:outline-none focus:ring-2 focus:ring-green-500" required />
                            {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                            <button type="submit" disabled={loading} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl font-semibold transition hover:shadow-lg">{loading ? <div className="loading-spinner mx-auto"></div> : (isReg ? 'Criar Conta ✨' : 'Entrar 🚀')}</button>
                            <p className="text-center text-secondary text-sm">{isReg ? 'Já tem conta?' : 'Não tem conta?'} <button type="button" onClick={()=>setIsReg(!isReg)} className="text-green-400">{isReg ? 'Fazer login' : 'Cadastre-se'}</button></p>
                        </form>
                    </div>
                </div>
            );
        };
        
        // ---------- MODAL DE CATEGORIAS ----------
        const CategoryManager = ({ categories, setCategories, onClose }) => {
            const [newCat, setNewCat] = React.useState('');
            const [editing, setEditing] = React.useState(null);
            const addCategory = () => {
                if(newCat && !categories.includes(newCat)) {
                    setCategories([...categories, newCat]);
                    setNewCat('');
                }
            };
            const editCategory = (oldName, newName) => {
                if(newName && !categories.includes(newName)) {
                    const idx = categories.indexOf(oldName);
                    if(idx!==-1) {
                        const updated = [...categories];
                        updated[idx] = newName;
                        setCategories(updated);
                        setEditing(null);
                    }
                }
            };
            const deleteCategory = (cat) => {
                if(cat !== 'amor' && cat !== 'espiritual') { // evitar deletar categorias padrão importantes?
                    setCategories(categories.filter(c=>c!==cat));
                } else showToast('Categoria padrão não pode ser removida');
            };
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="glass-effect rounded-2xl p-5 max-w-md w-full">
                        <h3 className="text-xl font-bold text-primary mb-3">Gerenciar Categorias</h3>
                        <div className="flex gap-2 mb-3">
                            <input type="text" value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Nova categoria" className="flex-1 p-2 rounded-xl bg-[#2d2d44] text-primary" />
                            <button onClick={addCategory} className="px-4 py-2 bg-green-500 rounded-xl text-white">+ Adicionar</button>
                        </div>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                            {categories.map(cat=>(
                                <div key={cat} className="flex items-center justify-between bg-[#2d2d44] p-2 rounded-xl">
                                    {editing === cat ? (
                                        <input type="text" defaultValue={cat} onBlur={(e)=>editCategory(cat, e.target.value)} autoFocus className="flex-1 p-1 rounded bg-[#1a1a2e] text-white" />
                                    ) : (
                                        <span className="text-primary">{cat}</span>
                                    )}
                                    <div className="flex gap-2">
                                        <button onClick={()=>setEditing(cat)} className="text-yellow-400">✏️</button>
                                        <button onClick={()=>deleteCategory(cat)} className="text-red-400">🗑️</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={onClose} className="mt-4 w-full py-2 bg-[#2d2d44] rounded-xl text-white">Fechar</button>
                    </div>
                </div>
            );
        };
        
        // ---------- MODAL DE HÁBITO (CRIAR/EDITAR) ----------
        const HabitFormModal = ({ isOpen, onClose, onSave, initial, personName }) => {
            const [title, setTitle] = React.useState('');
            const [desc, setDesc] = React.useState('');
            const [icon, setIcon] = React.useState('❤️');
            const [tag, setTag] = React.useState('amor');
            const [freqType, setFreqType] = React.useState('daily');
            const [weeklyDay, setWeeklyDay] = React.useState(0);
            const [customInterval, setCustomInterval] = React.useState(2);
            const [categories, setCategories] = React.useState(['amor','comunicação','espiritual','saúde','relacionamento']);
            const [showCategoryManager, setShowCategoryManager] = React.useState(false);
            
            React.useEffect(()=>{
                if(initial){
                    setTitle(initial.title||'');
                    setDesc(initial.description||'');
                    setIcon(initial.icon||'❤️');
                    setTag(initial.tag||'amor');
                    if(initial.frequency){
                        setFreqType(initial.frequency.type);
                        if(initial.frequency.type==='weekly') setWeeklyDay(initial.frequency.day||0);
                        if(initial.frequency.type==='custom') setCustomInterval(initial.frequency.interval||2);
                    } else { setFreqType('daily'); }
                } else {
                    setTitle(''); setDesc(''); setIcon('❤️'); setTag('amor'); setFreqType('daily'); setWeeklyDay(0); setCustomInterval(2);
                }
            },[initial]);
            
            if(!isOpen) return null;
            const handleSubmit = (e) => {
                e.preventDefault();
                let frequency = { type: freqType };
                if(freqType==='weekly') frequency.day = weeklyDay;
                if(freqType==='custom') frequency.interval = customInterval;
                onSave({ ...(initial||{}), title, description:desc, icon, tag, frequency });
                onClose();
            };
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="glass-effect rounded-2xl p-5 max-w-md w-full max-h-[90vh] overflow-y-auto">
                        <h3 className="text-xl font-bold text-primary mb-3">{initial ? '✏️ Editar Hábito' : '✨ Novo Hábito'} para {personName}</h3>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div>
                                <label className="text-secondary text-sm">Ícone (clique para selecionar)</label>
                                <div className="emoji-grid mt-1">
                                    {allEmojis.map(em => (
                                        <div key={em} onClick={()=>setIcon(em)} className={`emoji-btn ${icon===em ? 'selected' : ''}`}>{em}</div>
                                    ))}
                                </div>
                            </div>
                            <div><label className="text-secondary text-sm">Nome</label><input type="text" value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary" required /></div>
                            <div><label className="text-secondary text-sm">Descrição</label><textarea value={desc} onChange={e=>setDesc(e.target.value)} rows="2" className="w-full p-2 rounded-xl bg-[#2d2d44] text-primary"></textarea></div>
                            <div>
                                <label className="text-secondary text-sm">Categoria</label>
                                <div className="flex gap-2">
                                    <select value={tag} onChange={e=>setTag(e.target.value)} className="flex-1 p-2 rounded-xl bg-[#2d2d44] text-primary">
                                        {categories.map(c=> <option key={c} value={c}>{c}</option> )}
                                    </select>
                                    <button type="button" onClick={()=>setShowCategoryManager(true)} className="px-3 py-2 bg-blue-500 rounded-xl text-white text-sm">Editar</button>
                                </div>
                            </div>
                            <div>
                                <label className="text-secondary text-sm">Frequência</label>
                                <div className="flex flex-wrap gap-2 mt-1">
                                    <button type="button" onClick={()=>setFreqType('daily')} className={`px-3 py-1.5 rounded-xl text-sm ${freqType==='daily' ? 'bg-green-500 text-white' : 'bg-[#2d2d44] text-secondary'}`}>📅 Todo dia</button>
                                    <button type="button" onClick={()=>setFreqType('weekly')} className={`px-3 py-1.5 rounded-xl text-sm ${freqType==='weekly' ? 'bg-green-500 text-white' : 'bg-[#2d2d44] text-secondary'}`}>📆 Semanal</button>
                                    <button type="button" onClick={()=>setFreqType('custom')} className={`px-3 py-1.5 rounded-xl text-sm ${freqType==='custom' ? 'bg-green-500 text-white' : 'bg-[#2d2d44] text-secondary'}`}>🔄 Personalizado</button>
                                </div>
                                {freqType==='weekly' && (
                                    <select value={weeklyDay} onChange={e=>setWeeklyDay(parseInt(e.target.value))} className="mt-2 w-full p-2 rounded-xl bg-[#2d2d44] text-primary">
                                        {['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((d,i)=> <option key={i} value={i}>{d}</option>)}
                                    </select>
                                )}
                                {freqType==='custom' && (
                                    <div className="flex items-center gap-2 mt-2 flex-wrap">
                                        <span className="text-secondary">A cada</span>
                                        <select value={customInterval} onChange={e=>setCustomInterval(parseInt(e.target.value))} className="p-2 rounded-xl bg-[#2d2d44] text-primary w-24">
                                            <option value={2}>2 dias</option>
                                            <option value={3}>3 dias</option>
                                            <option value={5}>5 dias</option>
                                            <option value={7}>7 dias</option>
                                            <option value={10}>10 dias</option>
                                            <option value={15}>15 dias</option>
                                            <option value={30}>30 dias</option>
                                        </select>
                                        <input type="number" min="1" value={customInterval} onChange={e=>setCustomInterval(parseInt(e.target.value)||2)} className="p-2 rounded-xl bg-[#2d2d44] text-primary w-20" placeholder="outro" />
                                        <span className="text-secondary">dias</span>
                                    </div>
                                )}
                            </div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl bg-[#2d2d44] text-secondary">Cancelar</button>
                                <button type="submit" className="flex-1 py-2 rounded-xl bg-green-500 text-white font-semibold">Salvar</button>
                            </div>
                        </form>
                        {showCategoryManager && <CategoryManager categories={categories} setCategories={setCategories} onClose={()=>setShowCategoryManager(false)} />}
                    </div>
                </div>
            );
        };
        
        // ---------- ESTATÍSTICAS ----------
        const StatisticsView = ({ habits, personName }) => {
            const [period, setPeriod] = React.useState('week');
            const total = habits.reduce((a,h)=>a+(h.completedDates?.length||0),0);
            const streakTotal = habits.reduce((a,h)=>a+(h.streak||0),0);
            const best = habits.reduce((b,h)=> (h.streak > (b?.streak||0) ? h : b), null);
            const level = Math.floor(total/30)+1;
            const nextLevel = (level*30)-total;
            const dateRange = period==='week' ? getWeekDays().map(d=>d.toISOString().split('T')[0]) : (()=>{let d=[]; for(let i=29;i>=0;i--){let dt=new Date(); dt.setDate(dt.getDate()-i); d.push(dt.toISOString().split('T')[0]);} return d;})();
            let periodTotal=0;
            habits.forEach(h=>{ periodTotal += h.completedDates?.filter(d=>dateRange.includes(d)).length||0; });
            const avg = dateRange.length ? (periodTotal/dateRange.length).toFixed(1) : 0;
            return (
                <div className="space-y-4 pb-20 animate-fade-in-up">
                    <div className="grid grid-cols-2 gap-3">
                        <div className="bg-card border border-primary rounded-2xl p-3 text-center"><div className="text-2xl">📊</div><p className="text-2xl font-bold text-primary">{total}</p><p className="text-secondary text-xs">concluídos</p></div>
                        <div className="bg-card border border-primary rounded-2xl p-3 text-center"><div className="text-2xl">🔥</div><p className="text-2xl font-bold text-primary">{streakTotal}</p><p className="text-secondary text-xs">streak total</p></div>
                        <div className="bg-card border border-primary rounded-2xl p-3 text-center"><div className="text-2xl">🏆</div><p className="text-2xl font-bold text-primary">{level}</p><p className="text-secondary text-xs">nível</p></div>
                        <div className="bg-card border border-primary rounded-2xl p-3 text-center"><div className="text-2xl">📈</div><p className="text-2xl font-bold text-primary">{avg}</p><p className="text-secondary text-xs">média/dia</p></div>
                    </div>
                    <div className="bg-card border border-primary rounded-2xl p-3"><div className="w-full bg-[#2d2d44] rounded-full h-2"><div className="bg-green-500 h-full rounded-full" style={{width:`${(total%30)*3.33}%`}}></div></div><p className="text-secondary text-xs text-center mt-1">{nextLevel>0? `Faltam ${nextLevel} para nível ${level+1}`:'Parabéns! Nível máximo'}</p></div>
                    {best && <div className="bg-gradient-to-r from-green-500/20 to-emerald-500/20 rounded-2xl p-3 text-center border border-green-500/30"><p className="text-secondary text-xs">🏅 Melhor hábito</p><div className="flex justify-center items-center gap-2"><span className="text-2xl">{best.icon}</span><span className="text-primary font-semibold">{best.title}</span><span className="text-green-400">🔥{best.streak}</span></div></div>}
                    <div className="flex gap-2"><button onClick={()=>setPeriod('week')} className={`flex-1 py-2 rounded-xl text-sm ${period==='week'?'bg-green-500 text-white':'bg-[#2d2d44] text-secondary'}`}>Esta semana</button><button onClick={()=>setPeriod('month')} className={`flex-1 py-2 rounded-xl text-sm ${period==='month'?'bg-green-500 text-white':'bg-[#2d2d44] text-secondary'}`}>Este mês</button></div>
                    <div className="bg-card border border-primary rounded-2xl p-4 text-center"><p className="text-secondary text-xs">Média de hábitos/dia</p><p className="text-3xl font-bold text-primary">{avg}</p></div>
                </div>
            );
        };
        
        // ---------- APP PRINCIPAL ----------
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [activePerson, setActivePerson] = React.useState('josiel');
            const [nav, setNav] = React.useState('habits');
            const [theme, setTheme] = React.useState('dark');
            const [names, setNames] = React.useState({ josiel:'Josiel', zipora:'Zipora' });
            const [habitsData, setHabitsData] = React.useState({ josiel:[], zipora:[] });
            const [selectedDate, setSelectedDate] = React.useState(new Date());
            const [photo, setPhoto] = React.useState(null);
            const [modalOpen, setModalOpen] = React.useState(false);
            const [editingHabit, setEditingHabit] = React.useState(null);
            
            React.useEffect(()=>{
                const unsub = window.firebaseOnAuthStateChanged(window.firebaseAuth, async (authUser)=>{
                    if(authUser){
                        setUser(authUser);
                        const userRef = window.firebaseRef(window.firebaseDatabase, `users/${authUser.uid}`);
                        window.firebaseOnValue(userRef, (snap)=>{
                            if(snap.exists()){
                                const data = snap.val();
                                setNames(data.names || { josiel:'Josiel', zipora:'Zipora' });
                                setHabitsData(data.habits || { josiel:[], zipora:[] });
                                setTheme(data.theme || 'dark');
                                setPhoto(data.photo || null);
                                document.body.className = data.theme === 'light' ? 'light-mode' : '';
                            } else {
                                const init = {
                                    josiel: defaultHabits.map((h,i)=>({...h, id:`josiel_${i}`, completedDates:[getToday()], streak:1, order:i})),
                                    zipora: defaultHabits.map((h,i)=>({...h, id:`zipora_${i}`, completedDates:[getToday()], streak:1, order:i}))
                                };
                                setHabitsData(init);
                                window.firebaseSet(userRef, { names, habits:init, theme:'dark', photo:null });
                            }
                        });
                        setLoading(false);
                    } else { setUser(null); setLoading(false); }
                });
                return ()=>unsub();
            },[]);
            
            const updateFB = (data) => { if(user) window.firebaseUpdate(window.firebaseRef(window.firebaseDatabase, `users/${user.uid}`), data); };
            const handleNameChange = (pid, newName) => { const n={...names, [pid]:newName}; setNames(n); updateFB({names:n}); showToast(`Nome atualizado`); };
            const handleThemeChange = (t) => { setTheme(t); document.body.className = t==='light'?'light-mode':''; updateFB({theme:t}); };
            const handlePhoto = (e) => { const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onloadend=()=>{ setPhoto(reader.result); updateFB({photo:reader.result}); showToast('Foto atualizada'); }; reader.readAsDataURL(file); } };
            
            const addHabit = (habit) => {
                const newHabit = { ...habit, id: `${activePerson}_${Date.now()}`, completedDates:[], streak:0, order: habitsData[activePerson].length };
                const newData = { ...habitsData, [activePerson]: [...habitsData[activePerson], newHabit] };
                setHabitsData(newData);
                updateFB({habits:newData});
                showToast(`Hábito "${habit.title}" criado`);
            };
            const editHabit = (updated) => {
                const newData = { ...habitsData, [activePerson]: habitsData[activePerson].map(h=> h.id===updated.id ? updated : h) };
                setHabitsData(newData);
                updateFB({habits:newData});
                showToast(`Hábito atualizado`);
            };
            const deleteHabit = (id) => {
                const newData = { ...habitsData, [activePerson]: habitsData[activePerson].filter(h=> h.id!==id) };
                setHabitsData(newData);
                updateFB({habits:newData});
                showToast(`Hábito removido`);
            };
            const toggleHabit = (habitId, date) => {
                const updated = habitsData[activePerson].map(h=>{
                    if(h.id!==habitId) return h;
                    const already = h.completedDates?.includes(date)||false;
                    const newDates = already ? h.completedDates.filter(d=>d!==date) : [...(h.completedDates||[]), date];
                    return {...h, completedDates:newDates, streak: calculateStreak(newDates) };
                });
                const newData = { ...habitsData, [activePerson]: updated };
                setHabitsData(newData);
                updateFB({habits:newData});
                showToast(updated.find(h=>h.id===habitId).completedDates?.includes(date) ? '✅ Concluído!' : '⭕ Desmarcado');
            };
            const logout = async()=>{ await window.firebaseSignOut(window.firebaseAuth); setUser(null); showToast('Até logo!'); };
            
            if(loading) return <div className="min-h-screen flex items-center justify-center"><div className="loading-spinner"></div></div>;
            if(!user) return <LoginScreen onLogin={()=>{}} />;
            
            const stats = (pid)=>({ total: habitsData[pid].length, completed: habitsData[pid].filter(h=>h.completedDates?.includes(getToday())).length, streak: habitsData[pid].reduce((a,b)=>a+(b.streak||0),0) });
            const sJosiel = stats('josiel'), sZipora = stats('zipora');
            const gradient = activePerson === 'josiel' ? 'from-blue-500 to-cyan-500' : 'from-pink-500 to-rose-500';
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-[#0a0a0f] to-[#0f0f1a] pb-24">
                    <header className="border-b border-primary bg-[#0f0f1a]/80 backdrop-blur-xl sticky top-0 z-40">
                        <div className="px-4 py-3">
                            <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
                                <div className="flex items-center gap-3">
                                    <div className="avatar-container" onClick={()=>document.getElementById('photoUpload').click()}>
                                        {photo ? <img src={photo} className="w-12 h-12 rounded-full object-cover border-2 border-green-500" /> : <div className="w-12 h-12 rounded-full bg-gradient-to-r from-green-500 to-emerald-500 flex items-center justify-center text-2xl">💑</div>}
                                        <div className="avatar-overlay">📷</div>
                                        <input type="file" id="photoUpload" accept="image/*" className="hidden" onChange={handlePhoto} />
                                    </div>
                                    <div><h1 className="text-2xl font-bold couple-name-highlight">HabitFlow</h1><p className="text-secondary text-xs">Casal Cristão</p></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>setActivePerson('josiel')} className={`px-3 py-2 rounded-xl text-sm font-bold ${activePerson==='josiel' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💙 {names.josiel} 🔥{sJosiel.streak}</button>
                                    <button onClick={()=>setActivePerson('zipora')} className={`px-3 py-2 rounded-xl text-sm font-bold ${activePerson==='zipora' ? 'tab-active text-white' : 'bg-[#2d2d44] text-secondary'}`}>💖 {names.zipora} 🔥{sZipora.streak}</button>
                                    <button onClick={logout} className="px-3 py-2 rounded-xl bg-red-500/20 text-red-400 text-sm">🚪</button>
                                </div>
                            </div>
                            <WeekCalendar selectedDate={selectedDate} onSelect={setSelectedDate} habits={habitsData[activePerson]} />
                        </div>
                    </header>
                    <main className="px-4 py-4 max-w-2xl mx-auto">
                        {nav==='habits' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <div><h2 className="text-lg font-semibold text-primary">Meus Hábitos</h2><p className="text-secondary text-xs">{formatDate(selectedDate)}</p></div>
                                    <button onClick={()=>{ setEditingHabit(null); setModalOpen(true); }} className={`bg-gradient-to-r ${gradient} text-white px-3 py-1.5 rounded-xl text-sm font-semibold flex items-center gap-1`}>+ Novo</button>
                                </div>
                                {habitsData[activePerson].length===0 ? <div className="text-center py-12 bg-card rounded-2xl"><p className="text-secondary">Nenhum hábito</p></div> :
                                    <div className="space-y-2">{habitsData[activePerson].sort((a,b)=>(a.order||0)-(b.order||0)).map((h,idx)=> <HabitCard key={h.id} habit={h} onToggle={toggleHabit} onEdit={(h)=>{ setEditingHabit(h); setModalOpen(true); }} onDelete={deleteHabit} selectedDate={selectedDate} index={idx} />)}</div>
                                }
                            </div>
                        )}
                        {nav==='stats' && <StatisticsView habits={habitsData[activePerson]} personName={names[activePerson]} />}
                        {nav==='settings' && (
                            <div className="space-y-4">
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold">👤 Perfil</h3><div className="flex gap-2 mt-2"><input type="text" value={names[activePerson]} onChange={e=>handleNameChange(activePerson, e.target.value)} className="flex-1 p-2 rounded-xl bg-[#2d2d44] text-primary" /><button onClick={()=>handleNameChange(activePerson, names[activePerson])} className="px-4 py-2 bg-green-500 rounded-xl text-white">Salvar</button></div></div>
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold">🎨 Tema</h3><div className="flex items-center justify-between mt-2"><span className="text-secondary">{theme==='dark'?'🌙 Escuro':'☀️ Claro'}</span><label className="switch"><input type="checkbox" checked={theme==='light'} onChange={()=>handleThemeChange(theme==='dark'?'light':'dark')} /><span className="slider"></span></label></div></div>
                                <div className="bg-card border border-primary rounded-2xl p-4"><h3 className="text-primary font-semibold">ℹ️ Sobre</h3><p className="text-secondary text-sm">Versão 3.0 - Com categorias e frequências personalizadas</p></div>
                                <div className="bg-card border border-red-500/30 rounded-2xl p-4"><button onClick={logout} className="w-full py-2 bg-red-500/20 rounded-xl text-red-400">Sair da conta</button></div>
                            </div>
                        )}
                    </main>
                    <div className="bottom-nav">
                        <div onClick={()=>setNav('habits')} className={`bottom-nav-item ${nav==='habits'?'bottom-nav-active':'bottom-nav-inactive'}`}><span className="text-2xl">📋</span><span>Hábitos</span></div>
                        <div onClick={()=>setNav('stats')} className={`bottom-nav-item ${nav==='stats'?'bottom-nav-active':'bottom-nav-inactive'}`}><span className="text-2xl">📊</span><span>Stats</span></div>
                        <div onClick={()=>setNav('settings')} className={`bottom-nav-item ${nav==='settings'?'bottom-nav-active':'bottom-nav-inactive'}`}><span className="text-2xl">⚙️</span><span>Config</span></div>
                    </div>
                    <HabitFormModal isOpen={modalOpen} onClose={()=>{ setModalOpen(false); setEditingHabit(null); }} onSave={editingHabit ? editHabit : addHabit} initial={editingHabit} personName={names[activePerson]} />
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
